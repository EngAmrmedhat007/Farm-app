<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>متابعة المزرعة</title>
<meta name="theme-color" content="#12301F">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Reem+Kufi:wght@500;600;700&display=swap">
<style>
:root{
  --bg:#EEF1EA; --surface:#FBFCF9; --surface2:#E5EBE0; --fg:#16241C; --muted:#5B6B61; --line:#CCD6C7;
  --brand:#1E6B50; --brand-fg:#FFFFFF; --brand-soft:#D6E8DE;
  --hero:#12301F; --hero2:#1D4D36; --hero-fg:#F2F6EF; --gold:#E0B04A;
  --ok:#2E7D32; --okbg:#E1F0E2; --warn:#9A5800; --warnbg:#FFF0D2; --bad:#B3261E; --badbg:#FCE3E0; --info:#1D5F8A; --infobg:#DDEBF5;
  --font:"IBM Plex Sans Arabic","Noto Sans Arabic",Tahoma,system-ui,sans-serif;
  --display:"Reem Kufi","IBM Plex Sans Arabic",Tahoma,sans-serif;
  --r:16px; color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0D1511; --surface:#16211B; --surface2:#1F2D25; --fg:#E6EEE8; --muted:#97A99D; --line:#2D3F34;
    --brand:#5CC59A; --brand-fg:#06241A; --brand-soft:#1B3A2D;
    --hero:#0A1F15; --hero2:#12301F; --hero-fg:#E9F2EB; --gold:#EBC067;
    --ok:#7CCB82; --okbg:#17321B; --warn:#F0B04A; --warnbg:#3A2C10; --bad:#FF8A80; --badbg:#3E1B18; --info:#7FBCE6; --infobg:#16303F;
    color-scheme:dark;
  }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--font);font-size:15px;line-height:1.55;direction:rtl;
  padding-bottom:calc(92px + env(safe-area-inset-bottom,0px))}
body.lock{overflow:hidden}
h1,h2,h3,h4{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
[hidden]{display:none!important}
:focus-visible{outline:3px solid var(--brand);outline-offset:2px}
.wrap{max-width:640px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.muted{color:var(--muted)} .small{font-size:13px} .num{font-variant-numeric:tabular-nums}

/* hero */
.hero{background:linear-gradient(160deg,var(--hero2),var(--hero));color:var(--hero-fg);padding:calc(14px + env(safe-area-inset-top,0px)) 0 22px;border-radius:0 0 28px 28px}
.hero.lite{padding-bottom:16px;border-radius:0 0 22px 22px}
.hrow{display:flex;align-items:center;gap:12px}
.logo{width:46px;height:46px;border-radius:50%;border:2px solid rgba(255,255,255,.35);flex:none;background:#fff}
.ht{flex:1;min-width:0}
.ht h1{font-family:var(--display);font-size:24px;font-weight:600;line-height:1.2}
.ht .by{font-size:12.5px;opacity:.8;color:var(--gold);font-weight:600}
.bell{position:relative;width:46px;height:46px;border-radius:14px;border:0;background:rgba(255,255,255,.12);font-size:20px;color:inherit}
.bell i{position:absolute;top:-6px;inset-inline-start:-6px;background:var(--bad);color:#fff;border-radius:99px;font-style:normal;font-size:12px;min-width:20px;height:20px;line-height:20px;text-align:center;padding:0 5px;font-weight:700}
.datebar{display:flex;gap:8px;align-items:center;margin-top:16px}
.datebar input{flex:1;min-width:0;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.2);color:var(--hero-fg);color-scheme:dark;text-align:center}
.datebar button{width:44px;height:46px;border-radius:12px;border:0;background:rgba(255,255,255,.12);color:inherit;font-size:18px}
.shiftseg{display:grid;grid-template-columns:1fr 1fr;gap:4px;margin-top:12px;background:rgba(255,255,255,.1);border-radius:14px;padding:4px}
.shiftseg button{border:0;border-radius:11px;min-height:44px;background:transparent;font-weight:600;color:inherit;opacity:.85}
.shiftseg button[aria-pressed="true"]{background:var(--hero-fg);color:var(--hero);opacity:1}
.sum{display:flex;align-items:center;gap:18px;margin-top:18px}
.ring{--p:0;width:98px;height:98px;flex:none;border-radius:50%;background:conic-gradient(var(--gold) calc(var(--p)*1%),rgba(255,255,255,.16) 0);display:grid;place-items:center;position:relative}
.ring::before{content:"";position:absolute;inset:9px;border-radius:50%;background:var(--hero)}
.ring b{position:relative;font-family:var(--display);font-size:21px}
.sum .lbl{font-size:13px;opacity:.78}
.sum .big{font-family:var(--display);font-size:40px;line-height:1.05;font-weight:600}
.sum .big small{font-size:17px;font-weight:500}
.mini{display:flex;gap:16px;margin-top:6px;font-size:12.5px;opacity:.9;flex-wrap:wrap}
.mini b{display:block;font-size:16px}

/* inputs */
input[type=text],input[type=number],input[type=date],input[type=time],select,textarea{
  width:100%;min-height:48px;padding:8px 12px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);color:var(--fg);font-size:16px;min-width:0}
input:focus,select:focus,textarea:focus{border-color:var(--brand)}
input[type=number]{text-align:center;font-variant-numeric:tabular-nums}
input[type=checkbox]{width:22px;height:22px;accent-color:var(--brand)}
textarea{min-height:90px;font-size:14px;direction:ltr;text-align:left}
input::placeholder,textarea::placeholder{color:var(--muted);opacity:.6}
label.f{display:flex;flex-direction:column;gap:4px;min-width:0}
label.f>span{font-size:13px;color:var(--muted);font-weight:500}
small.eg{color:var(--brand);font-weight:700;min-height:18px;text-align:center;font-size:12.5px;font-variant-numeric:tabular-nums}
.g2,.g3,.g4{display:grid;gap:10px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}.g4{grid-template-columns:repeat(4,minmax(0,1fr))}.g1{display:grid;gap:10px}
@media (max-width:420px){.g4{grid-template-columns:repeat(2,minmax(0,1fr))}}

/* buttons */
.btn{min-height:46px;padding:8px 18px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);font-weight:600}
.btn.primary{background:var(--brand);color:var(--brand-fg);border-color:var(--brand)}
.btn.danger{color:var(--bad);border-color:var(--bad);background:transparent}
.btn.sm{min-height:40px;padding:4px 14px;font-size:14px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.spread{justify-content:space-between}

/* sections */
.sec-t{display:flex;justify-content:space-between;align-items:baseline;margin:22px 0 10px;gap:8px}
.sec-t h2{font-family:var(--display);font-size:21px;font-weight:600}
.card,.box{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin-top:12px}
.box{display:flex;flex-direction:column;gap:10px}
.box>h3,.card>h3{font-size:15px;color:var(--muted);font-weight:600}
.box.k{border-inline-start:6px solid var(--brand)}
.box.g{border-inline-start:6px solid var(--gold)}
.kv{display:flex;justify-content:space-between;gap:8px;padding:7px 0;border-bottom:1px dashed var(--line);font-variant-numeric:tabular-nums}
.kv:last-child{border:0}
.pill{display:inline-block;border-radius:99px;padding:2px 11px;font-size:12.5px;font-weight:700;background:var(--surface2)}
.pill.ok{background:var(--okbg);color:var(--ok)}.pill.bad{background:var(--badbg);color:var(--bad)}.pill.warn{background:var(--warnbg);color:var(--warn)}.pill.info{background:var(--infobg);color:var(--info)}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(104px,1fr));gap:8px}
.tile{background:var(--surface2);border-radius:12px;padding:10px 12px;min-width:0}
.tile b{display:block;font-size:21px;font-variant-numeric:tabular-nums;line-height:1.25}
.tile span{font-size:12.5px;color:var(--muted)}
.tile .sub{display:block;color:var(--fg);font-weight:600;font-size:13px}
.tile.ok b{color:var(--ok)}.tile.bad b{color:var(--bad)}.tile.warn b{color:var(--warn)}
.empty{padding:26px 12px;text-align:center;color:var(--muted)}
.saved{font-size:12.5px;color:var(--ok);min-height:18px}

/* alerts */
#banner{display:flex;flex-direction:column;gap:8px;margin-top:12px}
.alert{display:flex;gap:10px;align-items:flex-start;border-radius:14px;padding:12px;border:1.5px solid var(--line);background:var(--surface)}
.alert.bad{background:var(--badbg);border-color:var(--bad)}.alert.warn{background:var(--warnbg);border-color:var(--warn)}.alert.info{background:var(--infobg);border-color:var(--info)}
.alert p{margin:0;flex:1;min-width:0;font-weight:500}
.alert time{display:block;font-size:12px;color:var(--muted);font-weight:400}

/* house grid */
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.hc{background:var(--surface);border:1.5px solid var(--line);border-radius:var(--r);padding:14px;text-align:start;position:relative;overflow:hidden;min-width:0}
.hc .n{font-family:var(--display);font-size:46px;line-height:1;color:var(--brand);font-weight:600}
.hc .nm{font-size:12.5px;color:var(--muted)}
.hc .tr{font-weight:700;font-size:19px;margin-top:8px;font-variant-numeric:tabular-nums}
.hc .tr small{font-weight:500;color:var(--muted);font-size:13px}
.hc .ln{font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.hc .pb{height:7px;background:var(--surface2);border-radius:4px;margin-top:9px;overflow:hidden}
.hc .pb i{display:block;height:100%;background:var(--brand);border-radius:4px}
.hc.empty .n{color:var(--line)}
.hc .tag{position:absolute;top:10px;inset-inline-end:10px;font-size:11.5px;font-weight:700;border-radius:99px;padding:1px 8px}
.hc .tag.bad{background:var(--badbg);color:var(--bad)}.hc .tag.ok{background:var(--okbg);color:var(--ok)}

/* nav */
nav.dock{position:fixed;bottom:0;left:0;right:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);
  padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px))}
nav.dock #nav{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;max-width:640px;margin:0 auto}
nav.dock button{border:0;background:transparent;min-height:54px;border-radius:14px;font-size:12px;font-weight:600;color:var(--muted);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;padding:2px;position:relative}
nav.dock button span{font-size:20px;line-height:1.1}
nav.dock button[aria-current="page"]{background:var(--brand-soft);color:var(--brand)}
nav.dock button em{position:absolute;top:2px;inset-inline-end:14px;background:var(--bad);color:#fff;border-radius:99px;font-style:normal;font-size:10.5px;min-width:17px;height:17px;line-height:17px;text-align:center;font-weight:700}

/* sheet */
.sheet{position:fixed;inset:0;z-index:40;background:var(--bg);overflow-y:auto;padding-bottom:calc(120px + env(safe-area-inset-bottom,0px))}
.shead{position:sticky;top:0;z-index:2;background:var(--hero);color:var(--hero-fg);padding:calc(10px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px));display:flex;align-items:center;gap:12px}
.shead .back{min-height:42px;padding:0 16px;border-radius:12px;border:0;background:rgba(255,255,255,.14);font-weight:700;color:inherit}
.shead h2{font-family:var(--display);font-size:21px;font-weight:600;flex:1}
.tabs2{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:12px;background:var(--surface2);border-radius:14px;padding:4px}
.tabs2 button{border:0;background:transparent;min-height:46px;border-radius:11px;font-weight:700;color:var(--muted)}
.tabs2 button[aria-pressed="true"]{background:var(--brand);color:var(--brand-fg)}
.live{position:fixed;bottom:0;left:0;right:0;z-index:45;background:var(--hero);color:var(--hero-fg);display:grid;grid-template-columns:repeat(4,1fr);gap:4px;text-align:center;
  padding:10px max(12px,env(safe-area-inset-right,0px)) calc(10px + env(safe-area-inset-bottom,0px)) max(12px,env(safe-area-inset-left,0px))}
.live b{display:block;font-family:var(--display);font-size:20px;color:var(--gold);font-weight:600;font-variant-numeric:tabular-nums}
.live span{font-size:11.5px;opacity:.8}
.hrs{display:flex;gap:8px;overflow-x:auto;padding:4px 2px 10px;scrollbar-width:thin}
.hrs button{flex:0 0 auto;min-width:70px;min-height:50px;border-radius:14px;border:1.5px solid var(--line);background:var(--surface);font-weight:700;position:relative}
.hrs button[aria-pressed="true"]{background:var(--brand);color:var(--brand-fg);border-color:var(--brand)}
.hrs button i{position:absolute;top:5px;inset-inline-end:7px;width:8px;height:8px;border-radius:50%;background:var(--gold)}
.curt{font-size:13px;font-weight:600;color:var(--info);min-height:19px}
.hrow2{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;align-items:end}
.hnav{margin-top:12px;display:grid;gap:8px}.hnav .hch button{position:relative}.hnav .hch i{position:absolute;top:3px;right:3px;width:6px;height:6px;border-radius:50%;background:var(--gold)}.hnav .btn[disabled]{opacity:.35}
.sw{display:flex;align-items:center;justify-content:center;gap:6px;min-height:44px;padding:0 6px;border:1px solid var(--line);border-radius:12px;background:var(--surface);font-size:12.5px;cursor:pointer}
.hrow2 label.f>span{font-size:11.5px}
.hrow2 input{padding:6px 4px;min-height:44px;font-size:15px}
.hh{display:flex;flex-direction:column;gap:8px;border:1px solid var(--line);border-radius:14px;padding:10px;background:var(--surface);margin-top:10px}
.hh header{display:flex;justify-content:space-between;align-items:center}

/* tasks */
.task{background:var(--surface);border:1.5px solid var(--line);border-radius:var(--r);padding:13px;margin-top:10px;display:flex;flex-direction:column;gap:10px}
.task.done{border-color:var(--ok);background:var(--okbg)}
.task .top{display:flex;align-items:center;gap:12px}
.chk{width:34px;height:34px;flex:none;border-radius:10px;border:2px solid var(--line);background:var(--surface);font-size:18px;color:transparent;font-weight:900}
.chk[aria-pressed="true"]{background:var(--ok);border-color:var(--ok);color:#fff}
.task .top b{flex:1;font-size:16px}
.hch{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:6px}
.hch button{min-height:42px;border-radius:10px;border:1.5px solid var(--line);background:var(--surface2);font-weight:700;font-variant-numeric:tabular-nums}
.hch button[aria-pressed="true"]{background:var(--ok);border-color:var(--ok);color:#fff}
.prog{height:9px;background:var(--surface2);border-radius:5px;overflow:hidden}.prog i{display:block;height:100%;background:var(--ok);border-radius:5px}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}
.tbox{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
th,td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:center;font-size:14px;white-space:nowrap}
th{background:var(--surface2);font-weight:600}
td.hot{background:var(--badbg);color:var(--bad);font-weight:700}
td small{display:block;color:var(--muted);font-size:11.5px}
details>summary{cursor:pointer;font-weight:600;min-height:36px;display:flex;align-items:center}
.eng{background:linear-gradient(160deg,var(--brand-soft),var(--surface));border-color:var(--brand)}
.eng .who{font-family:var(--display);font-size:26px;font-weight:600;color:var(--brand)}
.titem{display:flex;flex-direction:column;gap:6px;padding:12px;border:1.5px solid var(--line);border-radius:14px;background:var(--surface);margin-top:10px}
.titem.late{border-color:var(--bad);background:var(--badbg)}.titem.done{opacity:.6}
.qty{display:flex;flex-wrap:wrap;gap:6px}.qty span{background:var(--surface2);border-radius:8px;padding:2px 9px;font-size:13px;font-variant-numeric:tabular-nums}
.houseset{border:1px solid var(--line);border-radius:14px;padding:12px;background:var(--bg);display:flex;flex-direction:column;gap:10px;margin-top:8px}
.iss{border:1px solid var(--line);border-radius:14px;padding:12px;background:var(--surface);display:flex;flex-direction:column;gap:8px;margin-top:8px}
.iss.done{opacity:.65}
ul.hl{margin:0;padding-inline-start:20px;display:flex;flex-direction:column;gap:4px}
.foot{text-align:center;color:var(--muted);font-size:13px;margin:26px 0 6px}
.foot b{font-family:var(--display);color:var(--brand);font-size:15px;font-weight:600}
@media (prefers-reduced-motion:no-preference){.alert{animation:pop .25s ease-out}@keyframes pop{from{transform:translateY(-6px);opacity:.3}to{transform:none;opacity:1}}}

.micwrap{position:relative}.micwrap input,.micwrap textarea{padding-inline-end:46px}
.mic{position:absolute;inset-inline-end:6px;top:50%;transform:translateY(-50%);width:36px;height:36px;border-radius:50%;border:1px solid var(--line);background:var(--surface2);font-size:17px;cursor:pointer;padding:0}
.mic.on{background:var(--bad);animation:pulse 1s infinite}@keyframes pulse{50%{opacity:.5}}
.wd{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}.wd button{min-height:38px;padding:0 10px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--fg);font:inherit;font-size:13px}.wd button[aria-pressed="true"]{background:var(--brand);color:var(--brand-fg);border-color:var(--brand)}
#lock{position:fixed;inset:0;z-index:300;background:var(--bg);display:grid;place-items:center;padding:24px}
.lockbox{width:100%;max-width:340px;text-align:center;display:grid;gap:10px}.lockbox input{text-align:center;font-size:26px;letter-spacing:8px;min-height:56px}
.chb{margin-top:14px}.chart{width:100%;height:auto;display:block;margin-top:4px;direction:ltr}.chart .gl{stroke:var(--line);stroke-width:1}.chart .gt{fill:var(--muted);font-size:9px}.chart .ln{fill:none;stroke-width:2.2;stroke-linejoin:round}.chart .ref{stroke:var(--bad);stroke-width:1;stroke-dasharray:4 3;opacity:.7}
.lg{display:flex;gap:14px}.lg i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-inline-end:5px}.chempty{padding:18px;text-align:center;color:var(--muted);font-size:13px}
#repView{position:fixed;inset:0;z-index:120;background:#fff;color:#111;overflow:auto;--fg:#111;--muted:#555;--line:#ccc;--brand:#1E6B50;--gold:#B8860B;--bad:#B3261E;--info:#1D5F8A;--surface:#fff;--surface2:#f2f2f2;--brand-fg:#fff}
#repView .rbar{position:sticky;top:0;background:#f4f6f2;padding:10px 14px;border-bottom:1px solid #ccc;z-index:2}
#repView .btn{color:#111;background:#fff;border:1px solid #bbb}#repView .btn.primary{background:var(--brand);color:#fff;border-color:var(--brand)}
#repView .hrs button{color:#111}#repView .hrs button[aria-pressed="true"]{background:var(--brand);color:#fff}
.rpage{padding:14px 14px 40px;font-size:12px;line-height:1.6}.rpage h1{font-size:20px;margin:0}.rpage h2{font-size:14px;margin:2px 0 0;color:#444;font-weight:500}.rpage h3{font-size:14px;margin:16px 0 6px;border-bottom:2px solid var(--brand);padding-bottom:3px}
.rhead{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;border-bottom:3px solid var(--brand);padding-bottom:8px}.rsig{font-weight:700;text-align:left;color:var(--brand);white-space:nowrap}.rsig span{font-weight:400;font-size:11px;color:#555}
.rpage table{width:100%;border-collapse:collapse;font-size:10.5px;display:block;overflow-x:auto}.rpage th,.rpage td{border:1px solid #ccc;padding:3px 4px;text-align:center;white-space:nowrap}.rpage th{background:#e9efe7}
.rfoot{margin-top:20px;color:#666;font-size:11px;text-align:center}.rch{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media print{@page{size:A4;margin:12mm}body.repopen>*:not(#repView){display:none!important}body.repopen{background:#fff!important;padding:0!important}#repView{position:static!important;overflow:visible!important;inset:auto}.norep{display:none!important}.rpage{padding:0;font-size:11px}.rpage table{display:table;overflow:visible}.rpage h3{break-after:avoid}.chb{break-inside:avoid}}

.crow{display:grid;grid-template-columns:78px 1fr 1fr;gap:8px;align-items:end;padding:8px 0;border-top:1px dashed var(--line)}.crow b{align-self:center;font-size:14px}.crow .eg{grid-column:1/-1;color:var(--brand);font-weight:600;min-height:0}

<body>
<div id="app"></div>
<div id="sheetHost"></div>
<nav class="dock"><section class="sbrand"><div class="slogo"><img src="icon-192.png" alt=""></div><h1>مزرعة الدقهلية للدواجن</h1><p>منظومة المتابعة الميدانية</p><div class="sclock" id="sclock"></div></section><div id="nav"></div><section class="sfoot"><span>إعداد وتصميم</span><b>م/ عمرو مدحت</b><i></i><small id="sver"></small></section></nav>

<script>
(function(){
'use strict';
const KEY='dakahlia_farm_v1', VER=16;
const HOURS=[18,19,20,21,22,23,0,1,2,3,4,5,6];
const pad=n=>(n<10?'0':'')+n;
const isoDate=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const parseD=s=>new Date(s+'T12:00:00');
const addDays=(s,n)=>{const d=parseD(s);d.setDate(d.getDate()+n);return isoDate(d)};
const diffDays=(a,b)=>Math.round((parseD(b)-parseD(a))/864e5);
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const num=v=>{const n=parseFloat(v);return isNaN(n)?0:n};
const has=v=>v!==undefined&&v!==null&&v!==''&&!(typeof v==='number'&&isNaN(v));
const fmtN=n=>Number(n).toLocaleString('en-US',{maximumFractionDigits:1});
const $=(s,r)=>(r||document).querySelector(s);
const $$=(s,r)=>Array.from((r||document).querySelectorAll(s));
const hLabel=h=>(h%12||12)+(h>=12?' م':' ص');
const WD=['الأحد','الاثنين','الثلاثاء','الأربعاء','الخميس','الجمعة','السبت'];
const fmtDate=s=>{const d=parseD(s);return WD[d.getDay()]+' '+d.getDate()+'/'+(d.getMonth()+1)+'/'+d.getFullYear()};
const today=()=>isoDate(new Date());

/* ---------- state ---------- */
const mkHouses=()=>{const a=[];for(let i=1;i<=8;i++)a.push({id:i,name:'عنبر '+i,hensC:'',roosC:'',hensF:'',roosF:'',fans:'',show:true,tgtC:'',tgtF:''});return a};
const DEFTASKS=()=>[
 {id:'t1',label:'تفقد الفرز والنافق',shift:'day',perHouse:true,times:[],on:true},
 {id:'t2',label:'وجود علف في سير العلف (ذكور)',shift:'day',perHouse:true,times:[],on:true},
 {id:'t3',label:'وجود علف في سير العلف (إناث)',shift:'day',perHouse:true,times:[],on:true},
 {id:'t4',label:'تفقد الستائر حسب عدد المراوح الشغالة',shift:'day',perHouse:true,times:[],on:true,curtain:true},
 {id:'t5',label:'تفقد السبل',shift:'day',perHouse:true,times:['09:00','15:00'],on:true},
 {id:'t6',label:'تفقد خطوط النبل',shift:'day',perHouse:true,times:['08:00','14:00'],on:true},
 {id:'t7',label:'تفقد الإضاءة داخل العنابر',shift:'day',perHouse:true,times:[],on:true},
 {id:'t8',label:'تفقد الستائر مع تغيّر عدد المراوح',shift:'eve',perHouse:true,times:[],on:true,curtain:true},
 {id:'t9',label:'تفقد خطوط النبل',shift:'eve',perHouse:true,times:['20:00'],on:true},
 {id:'t10',label:'نزول العلف مع مهندس التعليف',shift:'eve',perHouse:false,times:[],on:true}];
const DEF=()=>({settings:{houses:mkHouses(),hot:30,tray:30,sound:true,
  steps:[{t:26,p:25},{t:28,p:50},{t:30,p:75},{t:32,p:100}],
  curtain:[{f:4,cm:35},{f:6,cm:50},{f:8,cm:65},{f:10,cm:80}],curtainPer:8,hegM:'',hegF:'',hegSource:'all',workers:[],crews:[],crewRot:{date:'',idx:0},penalties:[],wake:{on:false,time:'23:30'},pin:'',pinQ:'',pinA:'',lastBackup:0,
  tasks:DEFTASKS(),engineers:[],rot:{date:'',idx:0}},
  days:{},eve:{},treat:[],alerts:[],fired:{},todo:{},feedEng:{},feedCrew:{},crewMod:{},evx:{},copied:{},issues:[],handover:{}});
let S,storageOK=true;
function load(){
  let raw=null;
  try{raw=JSON.parse(localStorage.getItem(KEY))}catch(e){storageOK=false}
  S=DEF();
  if(raw&&typeof raw==='object'){
    ['days','eve','treat','alerts','fired','todo','feedEng','feedCrew','crewMod','evx','copied','issues','handover'].forEach(k=>{if(raw[k])S[k]=raw[k]});
    if(raw.settings)for(const k in raw.settings){if(raw.settings[k]!==undefined&&raw.settings[k]!==null)S.settings[k]=raw.settings[k]}
  }
  const H=S.settings.houses;
  while(H.length<8)H.push({id:H.length+1,name:'عنبر '+(H.length+1),hensC:'',roosC:'',hensF:'',roosF:'',fans:'',show:true,tgtC:'',tgtF:''});
  H.forEach(h=>{['hensC','hensF','roosC','roosF','tgtC','tgtF'].forEach(k=>{if(h[k]===undefined)h[k]=''});if(h.show===undefined)h.show=true});
  if(!Array.isArray(S.issues))S.issues=[];
  if(!S.handover||typeof S.handover!=='object')S.handover={};
  if(!Array.isArray(S.settings.tasks))S.settings.tasks=DEFTASKS();
  if(!Array.isArray(S.settings.engineers))S.settings.engineers=[];
  if(!S.settings.rot)S.settings.rot={date:'',idx:0};
  if(!Array.isArray(S.settings.workers))S.settings.workers=[];
  if(!Array.isArray(S.settings.crews))S.settings.crews=[];
  if(!S.settings.crewRot)S.settings.crewRot={date:'',idx:0};
  if(!S.feedCrew||typeof S.feedCrew!=='object')S.feedCrew={};
  if(!S.evx||typeof S.evx!=='object')S.evx={};
  if(!S.crewMod||typeof S.crewMod!=='object')S.crewMod={};
  if(!Array.isArray(S.settings.penalties))S.settings.penalties=[];
  if(!S.settings.wake||typeof S.settings.wake!=='object')S.settings.wake={on:false,time:'23:30'};
  S.settings.workers.forEach(w=>{if(!w.id)w.id=uid();if(w.lvl!=='s'&&w.lvl!=='j')w.lvl='j';if(!w.off||typeof w.off!=='object')w.off={from:'',to:''}});
  if(!S.copied||typeof S.copied!=='object')S.copied={};
}
function persist(){try{localStorage.setItem(KEY,JSON.stringify(S));storageOK=true}catch(e){storageOK=false}}
let saveT=null;
function persistSoon(){clearTimeout(saveT);saveT=setTimeout(()=>{persist();flash()},250)}
function flash(){const e=$('#savedmsg');if(e){e.textContent=storageOK?'تم الحفظ ✓':'التخزين غير متاح، انسخ نسخة احتياطية من السجل';e.style.color=storageOK?'':'var(--bad)'}}
load();

const ui={pinEdit:false,rcv:null,ledger:null,curHr:null,ch:{scope:0,range:14},rn:7,tab:'home',shift:new Date().getHours()>=17||new Date().getHours()<6?'eve':'day',date:today(),open:null,side:'c',hourView:false,
  hour:(()=>{const i=HOURS.indexOf(new Date().getHours());return i<0?0:i})(),all:{},panel:false,handover:false};
const hname=id=>S.settings.houses[id-1].name||('عنبر '+id);

/* ---------- day data ---------- */
function rec(date,key,create){
  if(!S.days[date]){if(!create)return {};S.days[date]={}}
  if(!S.days[date][key]){if(!create)return {};S.days[date][key]={}}
  return S.days[date][key];
}
const trayN=()=>num(S.settings.tray)||30;
function trayParts(n){const T=trayN(),a=Math.abs(Math.round(n));return {t:Math.floor(a/T),e:a%T}}
function trayText(n){const q=trayParts(n);return fmtN(q.t)+' طبق'+(q.e?' و '+fmtN(q.e)+' بيضة':'')}
const hShow=h=>S.settings.houses[h-1].show!==false;
const visH=()=>{const a=[1,2,3,4,5,6,7,8].filter(hShow);return a.length?a:[1,2,3,4,5,6,7,8]};
const dayHouses=date=>[1,2,3,4,5,6,7,8].filter(h=>hShow(h)||houseHas(date,h));
const defTarget=(h,sd)=>num(S.settings.houses[h-1]['tgt'+sd.toUpperCase()]);
function calc(r,def){
  const ct=num(r.c1)+num(r.c2)+num(r.c3),dt=num(r.d1)+num(r.d2)+num(r.d3),good=(ct+dt)*trayN(),x=num(r.dbl)+num(r.defect)+num(r.broken)+num(r.dead);
  return {c:good,x:x,tot:good+x,req:has(r.target)?num(r.target):num(def),trays:ct+dt,ct:ct,dt:dt};
}
function hasData(date,key){const r=rec(date,key);for(const k in r)if(has(r[k]))return true;return false}
const houseHas=(date,h)=>hasData(date,h)||hasData(date,h+'c')||hasData(date,h+'f')||(+h===8&&hasData(date,'8h'));
function countSeries(date,key,field,base,delta){
  let cur=base,anch=false;
  Object.keys(S.days).filter(d=>d<date).sort().forEach(d=>{const r=(S.days[d]||{})[key];if(r&&has(r[field])){cur=num(r[field]);anch=true}const x=delta(d);if(x){cur+=x;anch=true}});
  const r=rec(date,key);if(has(r[field]))return {n:num(r[field]),src:'today'};
  return {n:Math.max(0,cur),src:anch?'calc':'set'};
}
const dayRec=(d,k)=>(S.days[d]||{})[k]||{};
function sideBirds(date,h,sd,kind){
  const F=kind==='F',base=num(S.settings.houses[h-1][(F?'hens':'roos')+sd.toUpperCase()]);
  return countSeries(date,h+sd,F?'hens':'roos',base,d=>{const r=dayRec(d,h+sd);return -(num(r[F?'cullF':'cullM'])+num(r[F?'mortF':'mortM']))});
}
const sideHensInfo=(date,h,sd)=>sideBirds(date,h,sd,'F');
const hegSources=()=>S.settings.hegSource==='h8'?[8]:[1,2,3,4,5,6,7,8];
function hegIn(d,kind){let n=0;hegSources().forEach(h=>['c','f'].forEach(sd=>{n+=num(dayRec(d,h+sd)[kind==='F'?'cullF':'cullM'])}));return n}
function hegBalance(date,kind){
  const F=kind==='F';
  return countSeries(date,'8h',F?'hens':'roos',num(S.settings[F?'hegF':'hegM']),d=>hegIn(d,kind)-num(dayRec(d,'8h')[F?'mortF':'mortM']));
}
function hegDay(date){
  const o={};['M','F'].forEach(k=>{const b=hegBalance(date,k),inn=hegIn(date,k),m=num(rec(date,'8h')['mort'+k]);o[k]={open:b.n,src:b.src,inn:inn,mort:m,end:Math.max(0,b.n+inn-m)}});
  return o;
}

function houseEve(h,date){
  const T=[],O=[],F=[],M=[],HT=[];let n=0,hon=0;
  HOURS.forEach(x=>{const r=eveRec(date,x,h);if(evFilled(r))n++;if(has(r.tin))T.push(num(r.tin));if(has(r.tout))O.push(num(r.tout));if(has(r.fans))F.push(num(r.fans));if(has(r.hum))M.push(num(r.hum));if(has(r.heaters))HT.push(num(r.heaters));if(r.htr==='1'||num(r.heaters)>0)hon++});
  return {avgT:avg(T),minT:T.length?Math.min.apply(null,T):null,maxT:T.length?Math.max.apply(null,T):null,outT:avg(O),fans:F.length?Math.max.apply(null,F):null,hum:avg(M),n:n,heat:HT.length?Math.max.apply(null,HT):null,heatHrs:hon};
}

function curtainFor(n){
  const tb=S.settings.curtain.filter(x=>has(x.f)&&has(x.cm)).map(x=>({f:num(x.f),cm:num(x.cm)})).sort((a,b)=>a.f-b.f),per=num(S.settings.curtainPer)||8;
  for(let i=0;i<tb.length;i++)if(tb[i].f===n)return {cm:tb[i].cm,approx:false};
  if(!tb.length||n<tb[0].f)return {cm:Math.round(n*per),approx:true};
  for(let i=0;i<tb.length-1;i++)if(n>tb[i].f&&n<tb[i+1].f){const a=tb[i],b=tb[i+1];return {cm:Math.round(a.cm+(b.cm-a.cm)*(n-a.f)/(b.f-a.f)),approx:true}}
  const l=tb[tb.length-1];return {cm:Math.round(l.cm+(n-l.f)*per),approx:true};
}

      const t=audioCtx.currentTime+dt;g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(0.3,t+0.02);g.gain.exponentialRampToValueAtTime(0.0001,t+0.2);o.start(t);o.stop(t+0.22)});
  }catch(e){}
}

  if(c.req>0){const d=c.tot-c.req,tp=trayParts(d);tiles.push(['النسبة من المطلوب',(Math.round(c.tot/c.req*1000)/10)+'%',d>=0?'ok':'warn']);tiles.push([d>=0?'زيادة عن المطلوب (طبق)':'متبقي للجمع (طبق)',fmtN(tp.t),d>=0?'ok':'warn',tp.e?'و '+fmtN(tp.e)+' بيضة':''])}

function refreshHourView(){
  const hour=HOURS[ui.hour];
  $$('[data-box]').forEach(b=>{const p=b.getAttribute('data-box').split(':'),r=eveRec(ui.date,+p[1],+p[0]);
    const hot=has(r.tin)&&num(r.tin)>=num(S.settings.hot);
    $('[data-pill]',b).textContent=hot?'حرارة مرتفعة':evFilled(r)?'مسجل':'لم يسجل';$('[data-pill]',b).className='pill'+(hot?' bad':evFilled(r)?' ok':'');
    $('[data-curt]',b).textContent=has(r.fans)?curtTxt(num(r.fans)):''});
  const a=ui.all[hour]||{};const ac=$('#allCurt');if(ac)ac.textContent=has(a.fans)?curtTxt(num(a.fans)):'';

function applyAll(hour,vals,onlyEmpty,fromHouse){
  let n=0;
  for(let h=1;h<=8;h++){
    if(h===fromHouse)continue;
    const r=eveRec(ui.date,hour,h,true);
    eveFields.forEach(f=>{const v=vals[f[0]];if(!has(v))return;if(onlyEmpty&&has(r[f[0]]))return;r[f[0]]=v;n++});
  }
  persist();
  if(has(vals.fans)&&num(vals.fans)>0)pushAlert('curall-'+ui.date+'-'+hour+'-'+vals.fans,'كل العنابر: '+vals.fans+' مراوح شغالة، اضبط الستائر على '+curtainFor(num(vals.fans)).cm+' سم.','info');
  if(has(vals.tin)||has(vals.fans))for(let h=1;h<=8;h++)checkEve(h,hour,true);
  return n;
}

function showSheet(){
  const host=$('#sheetHost'),on=ui.open||ui.hourView||ui.handover||ui.ledger;
  host.innerHTML=!on?'':ui.handover?handoverHTML():ui.ledger?ledgerSheetHTML():ui.hourView?hourViewHTML():ui.shift==='day'?daySheetHTML():eveSheetHTML();
  document.body.classList.toggle('lock',!!on);
  addMics();
  const shd=$('.shead');if(shd)document.documentElement.style.setProperty('--sh',shd.offsetHeight+'px');
  if(on&&!ui.handover&&!ui.ledger){ui.hourView?refreshHourView():ui.shift==='day'?refreshDay():refreshEveSheet()}
  const sh=$('.sheet');
  if(on&&sh&&ui.open&&ui.shift==='eve'&&!ui.hourView&&!ui.ledger){
    sh.addEventListener('scroll',()=>{if(ui._raf)return;ui._raf=requestAnimationFrame(()=>{ui._raf=0;trackHours()})},{passive:true});
    if(ui.autoHr){ui.autoHr=false;const nh=nowHour();if(nh>=0){const b=$('[data-box="'+ui.open+':'+nh+'"]');if(b)sh.scrollTop=b.offsetTop-((shd?shd.offsetHeight:60)+90)}}
    trackHours();
  }
}
function openSheet(){history.pushState({sheet:1},'');showSheet()}

function missingHouses(t,date){const st=todoGet(date,t.id),m=[];taskHouses(t).forEach(i=>{if(!(st&&st.h[i]))m.push(i)});return m}
function handoverData(date,shift){
  const now=Date.now();
  const tasks=tasksFor(shift).filter(t=>!taskDone(t,date)).map(t=>t.perHouse?t.label+' — ناقص: عنبر '+missingHouses(t,date).join('، '):t.label);
  const treats=S.treat.filter(t=>{if(t.done)return false;const due=new Date(t.date+'T'+t.time+':00').getTime();return !isNaN(due)&&due<=now+864e5})
    .sort((a,b)=>(a.date+a.time)<(b.date+b.time)?-1:1)
    .map(t=>{const due=new Date(t.date+'T'+t.time+':00').getTime();return (t.kind==='vaccine'?'💉 ':'💊 ')+t.name+' — '+t.date+' '+t.time+(due<now?' (متأخر)':'')+' — '+qtyText(t)});
  const miss=[];(shift==='day'?dayHouses(date):[1,2,3,4,5,6,7,8]).forEach(h=>{if(shift==='day'?!houseHas(date,h):houseEve(h,date).n===0)miss.push(h)})
  const bad=S.alerts.filter(a=>a.level==='bad'&&now-a.ts<12*36e5).slice(0,5).map(a=>a.text);
  let sum;
  if(shift==='day'){const f=farmSum(date);sum=['الإجمالي: '+fmtN(f.tot)+' بيضة ('+fmtN(f.trays)+' طبق)'+(f.req>0?' = '+pctTxt(f):''),'النفوق: '+fmtN(f.mort)+' | الفرز: '+fmtN(f.cullM+f.cullF),'العلف: '+fmtN(f.feed)+' كجم']}
  else{const d=eveDay(date);let hotN=0;HOURS.forEach(x=>{for(let h=1;h<=8;h++){const r=eveRec(date,x,h);if(has(r.tin)&&num(r.tin)>=num(S.settings.hot))hotN++}});
    sum=['متوسط الحرارة: '+dash(d.avgT)+'° | الرطوبة: '+(d.hum===null?'—':Math.round(d.hum)+'%'),'قراءات حرارة مرتفعة: '+hotN,'مهندس التعليف: '+(engOn(date)||'—')]}
  return {tasks:tasks,treats:treats,miss:miss,bad:bad,sum:sum,issues:S.issues.filter(i=>!i.done).slice().reverse()};
}
function handoverText(date,shift){
  const D=handoverData(date,shift),ho=S.handover[date+':'+shift]||{},L=[];
  L.push('🤝 تسليم وردية '+(shift==='eve'?'المسائي':'النهاري')+' - '+fmtDate(date),'م/ عمرو مدحت'+(ho.by?' | المسلّم: '+ho.by:''),'━━━━━━━━━━');
  D.sum.forEach(x=>L.push(x));
  L.push('━━━━━━━━━━','⚠️ مشاكل مفتوحة:');
  if(D.issues.length)D.issues.forEach((i,n)=>L.push((n+1)+'. ['+(i.house?hname(i.house):'كل المزرعة')+'] '+i.text));else L.push('مفيش');
  L.push('✅ مهام ناقصة:');
  if(D.tasks.length)D.tasks.forEach(x=>L.push('• '+x));else L.push('كل المهام خلصت');
  if(D.treats.length){L.push('💉 علاج وتحصين قادم أو متأخر:');D.treats.forEach(x=>L.push('• '+x))}
  if(D.miss.length)L.push('📝 لم يتم التسجيل في: '+D.miss.map(hname).join('، '));
  if(D.bad.length){L.push('🔔 تنبيهات مهمة آخر 12 ساعة:');D.bad.forEach(x=>L.push('• '+x))}
  if(ho.note)L.push('━━━━━━━━━━','ملاحظات: '+ho.note);
  return L.join('\n');
}

const csvCell=v=>{v=String(v==null?'':v);return /[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v};
function dailyCSV(){
  const cols=['target','c1','c2','c3','dbl','defect','broken','dead','mortM','mortF','cullM','cullF','feed'];
  const rows=['التاريخ,العنبر,الجانب,المطلوب,جمعة1 طبق,جمعة2 طبق,جمعة3 طبق,دبل,مشوه,كسر,هالك,نفوق ديوك,نفوق دجاج,فرز ديوك,فرز دجاج,علف كجم,الصالح بيضة,الإجمالي بيضة,حرارة عظمى,حرارة صغرى,مياه لتر,سيلو بداية,سيلو نهاية,عدد الفراخ,جرام علف للفرخة,عدد الديوك,أطباق نظيفة,أطباق متسخة'];
  Object.keys(S.days).sort().forEach(d=>{for(let h=1;h<=8;h++){
    [['c','تبريد'],['f','مراوح']].forEach(sd=>{
      if(!hasData(d,h+sd[0]))return;const r=rec(d,h+sd[0]),k=calc(r,defTarget(h,sd[0])),hv=sideHens(d,h,sd[0]);
      rows.push([d,hname(h),sd[1]].concat(cols.map(c=>r[c])).concat([k.c,k.tot,'','','','','',hv,gramPer(r,hv),sideBirds(d,h,sd[0],'M').n,k.ct,k.dt]).map(csvCell).join(','));
    });
    if(h===8&&hasData(d,'8h')){const q=rec(d,'8h'),g=hegDay(d),a=new Array(28).fill('');a[0]=d;a[1]=hname(8);a[2]='الحجازة';a[11]=q.mortM||'';a[12]=q.mortF||'';a[23]=g.F.open;a[25]=g.M.open;rows.push(a.map(csvCell).join(','))}

/* ---------- feed workers & unloading crews ---------- */
const LVN={s:'قديم',j:'مبتدئ'};
const isOff=(w,date)=>!!(w&&w.off&&w.off.from&&date>=w.off.from&&(!w.off.to||date<=w.off.to));
const wById=id=>S.settings.workers.find(x=>x.id===id);
function crewIdx(date){
  const L=S.settings.crews;if(!L.length)return -1;
  if(has(S.feedCrew[date]))return Math.min(+S.feedCrew[date],L.length-1);
  const r=S.settings.crewRot;if(!r.date)return 0;
  return (((num(r.idx)+diffDays(r.date,date))%L.length)+L.length)%L.length;
}
const crewOn=date=>{const i=crewIdx(date);return i<0?null:S.settings.crews[i]};
const crewOfWorker=id=>S.settings.crews.findIndex(c=>(c.members||[]).indexOf(id)>=0);
function crewFinal(date){
  const c=crewOn(date);if(!c)return null;
  const W=S.settings.workers,n=S.settings.crews.length,bi=crewIdx(date);
  const list=(c.members||[]).filter(id=>wById(id)).map(id=>({id:id,tag:''}));
  const used=()=>list.map(x=>x.id);
  list.forEach(m=>{const w=wById(m.id);if(!isOff(w,date))return;
    let best=null,bd=-1;
    W.forEach(x=>{if(x.lvl!==w.lvl||isOff(x,date)||used().indexOf(x.id)>=0)return;const ci=crewOfWorker(x.id),d=ci<0?n:((ci-bi)%n+n)%n;if(d>bd){bd=d;best=x}});
    if(best){m.id=best.id;m.tag='بدل '+w.name+' (إجازة)'}else m.tag='في إجازة بدون بديل';
  });
  (S.settings.penalties||[]).forEach(p=>{
    if(!(date>=p.from&&date<addDays(p.from,num(p.days))))return;
    const pw=wById(p.w);if(!pw||isOff(pw,date)||used().indexOf(p.w)>=0)return;
    const i=list.findIndex(m=>{const w=wById(m.id);return w&&w.lvl===pw.lvl&&!m.pen});
    if(i>=0){const out=wById(list[i].id);list[i]={id:p.w,tag:'عقوبة بدل '+(out?out.name:''),pen:true}}else list.push({id:p.w,tag:'عقوبة',pen:true});
  });
  (S.crewMod[date]||[]).forEach(m=>{const i=list.findIndex(x=>x.id===m.out);if(i>=0&&wById(m['in']))list[i]={id:m['in'],tag:'بدل '+((wById(m.out)||{}).name||'')+' (يدوي)'}});
  return {name:c.name,idx:bi,members:list.map(x=>{const w=wById(x.id)||{};return {id:x.id,name:w.name||'؟',lvl:w.lvl,tag:x.tag}})};
}

  return ['طاقم تنزيل العلف: '+f.name+' ('+f.members.map(m=>m.name+(m.tag?' ['+m.tag+']':'')).join('، ')+')'];

/* ---------- send / receive (merge) ---------- */
const u8b64=u=>{let t='';for(let i=0;i<u.length;i+=0x8000)t+=String.fromCharCode.apply(null,u.subarray(i,i+0x8000));return btoa(t)};
const b64u8=b=>{const t=atob(b),u=new Uint8Array(t.length);for(let i=0;i<t.length;i++)u[i]=t.charCodeAt(i);return u};
async function makeCode(){
  const enc=new TextEncoder().encode(bkText());
  try{if(window.CompressionStream){const cs=new Blob([enc]).stream().pipeThrough(new CompressionStream('gzip'));return 'DKH1:'+u8b64(new Uint8Array(await new Response(cs).arrayBuffer()))}}catch(e){}
  return 'DKH0:'+u8b64(enc);
}
async function readCode(t){
  t=String(t||'').trim();
  if(t.indexOf('DKH1:')===0){const ds=new Blob([b64u8(t.slice(5))]).stream().pipeThrough(new DecompressionStream('gzip'));return JSON.parse(await new Response(ds).text())}
  if(t.indexOf('DKH0:')===0)return JSON.parse(new TextDecoder().decode(b64u8(t.slice(5))));
  return JSON.parse(t);
}
function mergeObj(dst,src,over,st){
  for(const k in src){const v=src[k];
    if(v&&typeof v==='object'&&!Array.isArray(v)){if(!dst[k]||typeof dst[k]!=='object'||Array.isArray(dst[k]))dst[k]={};mergeObj(dst[k],v,over,st)}
    else if(dst[k]===undefined||dst[k]===''||dst[k]===null){dst[k]=v;st.added++}
    else if(JSON.stringify(dst[k])!==JSON.stringify(v)){st.conf++;if(over)dst[k]=v}
  }
}
function mergeAll(dst,inc,over){
  const st={added:0,conf:0};
  ['days','eve','todo','feedEng','feedCrew','crewMod','evx','copied','handover'].forEach(k=>{if(inc[k]&&typeof inc[k]==='object'){if(!dst[k]||typeof dst[k]!=='object')dst[k]={};mergeObj(dst[k],inc[k],over,st)}});
  ['treat','issues'].forEach(k=>{if(Array.isArray(inc[k])){dst[k]=dst[k]||[];inc[k].forEach(x=>{const i=dst[k].findIndex(y=>y.id===x.id);if(i<0){dst[k].push(x);st.added++}else if(JSON.stringify(dst[k][i])!==JSON.stringify(x)){st.conf++;if(over)dst[k][i]=x}})}});
  return st;
}

/* ---------- charts ---------- */
const dateRange=(end,n)=>{const a=[];for(let i=n-1;i>=0;i--)a.push(addDays(end,-i));return a};
const anyHas=d=>dayHouses(d).some(h=>houseHas(d,h));
const sd_=d=>{const x=parseD(d);return x.getDate()+'/'+(x.getMonth()+1)};
function metricDay(date,scope,m){
  if(m==='prod'||m==='mort'){
    if(scope?!houseHas(date,scope):!anyHas(date))return null;
    const o=scope?houseSum(date,scope):farmSum(date);
    if(m==='mort')return o.mort;
    return o.req>0&&o.tot>0?Math.round(o.tot/o.req*1000)/10:null;
  }
  if(m==='gram'){let f=0,n=0;(scope?[scope]:dayHouses(date)).forEach(h=>{const q=feedHens(date,h);f+=q.f;n+=q.h});return n>0&&f>0?Math.round(f*1000/n*10)/10:null}
  const e=scope?houseEve(scope,date):eveDay(date),v=m==='tin'?e.avgT:e.outT;
  return v===null||v===undefined?null:Math.round(v*10)/10;
}
function lineChart(series,labels,o){
  o=o||{};const W=320,H=150,L=34,R=8,T=10,B=20,n=labels.length,vals=[];
  series.forEach(s=>s.v.forEach(v=>{if(v!==null&&v!==undefined)vals.push(v)}));
  if(o.ref!==undefined)vals.push(o.ref);
  if(!vals.length)return '<div class="chempty">لسه مفيش بيانات كفاية</div>';
  let mn=Math.min.apply(null,vals),mx=Math.max.apply(null,vals);
  if(o.zero)mn=Math.min(0,mn);if(mx===mn){mx+=1;mn-=1}
  const pad=(mx-mn)*0.1;if(!o.zero)mn-=pad;mx+=pad;
  const X=i=>n>1?L+(W-L-R)*i/(n-1):(L+W-R)/2,Y=v=>T+(H-T-B)*(1-(v-mn)/(mx-mn));let g='';
  [0,.5,1].forEach(f=>{const v=mn+(mx-mn)*f,y=Y(v).toFixed(1);g+='<line x1="'+L+'" x2="'+(W-R)+'" y1="'+y+'" y2="'+y+'" class="gl"/><text x="'+(L-4)+'" y="'+(+y+3)+'" class="gt" text-anchor="end">'+(Math.round(v*10)/10)+'</text>'});
  if(o.ref!==undefined){const y=Y(o.ref).toFixed(1);g+='<line x1="'+L+'" x2="'+(W-R)+'" y1="'+y+'" y2="'+y+'" class="ref"/>'}
  series.forEach(s=>{let seg=[];const fl=()=>{if(seg.length>1)g+='<polyline class="ln" style="stroke:'+s.c+'" points="'+seg.join(' ')+'"/>';seg=[]};
    s.v.forEach((v,i)=>{if(v===null||v===undefined){fl();return}const x=X(i).toFixed(1),y=Y(v).toFixed(1);seg.push(x+','+y);g+='<circle cx="'+x+'" cy="'+y+'" r="2.6" style="fill:'+s.c+'"/>'});fl()});
  [0,Math.floor((n-1)/2),n-1].forEach((i,k)=>{if(n<1||(k>0&&i===0))return;g+='<text x="'+X(i).toFixed(1)+'" y="'+(H-4)+'" class="gt" text-anchor="'+(k===0?'start':k===2?'end':'middle')+'">'+esc(labels[i])+'</text>'});
  return '<svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="'+esc(o.label||'رسم بياني')+'" class="chart">'+g+'</svg>';
}
const lastVal=a=>{for(let i=a.length-1;i>=0;i--)if(a[i]!==null&&a[i]!==undefined)return a[i];return null};
function chartBlock(title,series,labels,o){
  o=o||{};const lv=series.length?lastVal(series[0].v):null;
  return '<div class="chb"><div class="row spread"><b>'+title+'</b><span class="small muted">'+(lv===null?'':'آخر قراءة: <b class="num">'+fmtN(lv)+(o.unit||'')+'</b>')+'</span></div>'+lineChart(series,labels,Object.assign({label:title},o))+

function periodRows(D){
  const rows=[];
  D.forEach(d=>{const has_=anyHas(d),e=eveDay(d);if(!has_&&!e.reads)return;
    const f=farmSum(d);let ff=0,fn=0;dayHouses(d).forEach(h=>{const q=feedHens(d,h);ff+=q.f;fn+=q.h});
    rows.push({d:d,req:f.req,tot:f.tot,pct:pctOf(f),trays:f.trays,mort:f.mort,cull:f.cullM+f.cullF,feed:f.feed,gram:fn>0&&ff>0?Math.round(ff*1000/fn*10)/10:null,tin:e.avgT,tout:e.outT,hum:e.hum});
  });
  return rows;
}
function houseStats(D){
  const out=[];
  for(let h=1;h<=8;h++){
    const o={h:h,days:0,tot:0,mort:0,cull:0,feed:0,pcts:[],tins:[],hums:[],fans:null,tmax:null,heat:0,gf:0,gn:0,nights:0};
    D.forEach(d=>{
      if(houseHas(d,h)){const s=houseSum(d,h);o.days++;o.tot+=s.tot;o.mort+=s.mort;o.cull+=s.cullM+s.cullF;o.feed+=s.feed;if(s.req>0&&s.tot>0)o.pcts.push(s.tot/s.req*100);const q=feedHens(d,h);o.gf+=q.f;o.gn+=q.h}
      const e=houseEve(h,d);if(e.n){o.nights++;if(e.avgT!==null)o.tins.push(e.avgT);if(e.hum!==null)o.hums.push(e.hum);if(e.fans!==null)o.fans=Math.max(o.fans===null?0:o.fans,e.fans);if(e.maxT!==null)o.tmax=Math.max(o.tmax===null?-99:o.tmax,e.maxT);o.heat+=e.heatHrs}
    });
    if(o.days||o.nights)out.push(o);
  }
  return out;
}

const runsTxt=r=>{const i=heatInfo(r);if(i.a===null&&i.b===null)return '';return i.diff?'هيتر 1: '+durTxt(i.a)+' · هيتر 2: '+durTxt(i.b):'الهيتران: '+durTxt(i.a)+' لكل واحد'};

/* ---------- confirmations ---------- */
let pending=null;
function askConfirm(btn,action){
  if(pending&&pending.btn===btn){clearTimeout(pending.t);const a=pending.action;btn.textContent=pending.label;pending=null;runConfirmed(a);return}
  if(pending){pending.btn.textContent=pending.label;clearTimeout(pending.t)}
  const label=btn.textContent;btn.textContent='اضغط ثاني للتأكيد';
  pending={btn:btn,action:action,label:label,t:setTimeout(()=>{btn.textContent=label;pending=null},4000)};
}
function runConfirmed(a){
  const p=a.split(':');
  if(p[0]==='tdel'){S.treat=S.treat.filter(t=>t.id!==p[1]);persist();renderTList()}
  else if(p[0]==='clearalerts'){S.alerts=[];persist();renderBanner()}
  else if(p[0]==='deltask'){S.settings.tasks.splice(+p[1],1);persist();render()}
  else if(p[0]==='deleng'){S.settings.engineers.splice(+p[1],1);persist();render()}
  else if(p[0]==='delw'){const w=S.settings.workers[+p[1]];if(w){S.settings.crews.forEach(c=>{c.members=(c.members||[]).filter(x=>x!==w.id)});S.settings.workers.splice(+p[1],1);persist();render()}}
  else if(p[0]==='delcrew'){S.settings.crews.splice(+p[1],1);persist();render()}
  else if(p[0]==='pinoff'){S.settings.pin='';S.settings.pinQ='';S.settings.pinA='';ui.pinEdit=false;persist();render()}
  else if(p[0]==='autogrp'){autoGroups(+($('#grpSize').value||4));persist();render()}
  else if(p[0]==='forgotpin'){try{localStorage.removeItem(KEY)}catch(x){}location.reload()}
  else if(p[0]==='delcur'){S.settings.curtain.pop();persist();render()}
  else if(p[0]==='isdel'){S.issues=S.issues.filter(i=>i.id!==p[1]);persist();showSheet()}
  else if(p[0]==='wipe'){S.days={};S.eve={};S.treat=[];S.alerts=[];S.fired={};S.todo={};S.feedEng={};S.feedCrew={};S.crewMod={};S.evx={};S.copied={};S.issues=[];S.handover={};persist();render()}
  else if(p[0]==='restore'){
    const msg=$('#rsmsg');
    try{const o=JSON.parse(($('#rs').value||'').trim());if(!o||typeof o!=='object'||!o.settings)throw 0;localStorage.setItem(KEY,JSON.stringify(o));load();persist();msg.textContent='تمت الاستعادة ✓';msg.style.color='var(--ok)';renderBanner()}
    catch(e){msg.textContent='النص غير صالح، انسخ النسخة كاملة';msg.style.color='var(--bad)'}
  }
  else if(p[0]==='applyone'){
    const h=+p[1],hour=+p[2],r=eveRec(ui.date,hour,h),v={};eveFields.forEach(f=>{if(has(r[f[0]]))v[f[0]]=r[f[0]]});
    const n=applyAll(hour,v,false,h);ui.panel=false;showSheet();flashMsg('تم التطبيق على باقي العنابر ('+n+' خانة)');
  }
  else if(p[0]==='applyall'){
    const hour=+p[1],a=ui.all[hour]||{},v={};eveFields.forEach(f=>{if(has(a[f[0]]))v[f[0]]=a[f[0]]});
    const only=$('#onlyEmpty')&&$('#onlyEmpty').checked;
    const n=applyAll(hour,v,only,0);const keep=only;showSheet();const oe=$('#onlyEmpty');if(oe)oe.checked=keep;flashMsg('تم التطبيق على العنابر ('+n+' خانة)');
  }
}

  host.addEventListener('touchend',e=>{if(ui.hourView&&!ui.ledger){const t=e.changedTouches[0],dx=t.clientX-sx,dy=t.clientY-sy;if(Math.abs(dx)>110&&Math.abs(dy)<45&&Date.now()-st<700)stepHourView(dx>0?1:-1);return}if(!ui.open||ui.shift!=='day'||ui.hourView||ui.handover||ui.ledger)return;const t=e.changedTouches[0],dx=t.clientX-sx,dy=t.clientY-sy;

document.addEventListener('click',e=>{
  const t=e.target.closest('button,summary,[data-opend]');if(!t)return;
  const d=t.dataset||{};

  if(d.tab){ui.tab=d.tab;ui.panel=false;ui.open=null;ui.hourView=false;ui.ledger=null;render();window.scrollTo(0,0);return}
  if(d.shift){ui.shift=d.shift;render();return}
  if(d.day){ui.date=addDays(ui.date,+d.day);render();return}
  if(d.open){ui.open=+d.open;ui.autoHr=true;openSheet();return}
  if(d.act==='gotransfer'){ui.tab='log';ui.open=null;ui.hourView=false;ui.ledger=null;render();window.scrollTo(0,0);return}
  if(d.act==='ledger'){const was=ui.ledger||ui.open||ui.hourView;ui.open=null;ui.hourView=false;ui.ledger=d.kind;if(was)showSheet();else openSheet();return}
  if(d.ldday){ui.date=addDays(ui.date,+d.ldday);reshow();return}
  if(d.hstep){stepHour(+d.hstep);return}
  if(d.gohr){goHour(+d.gohr);return}
  if(d.hstep2){stepHourView(+d.hstep2);return}
  if(d.act==='back'){closeSheet();return}
  if(d.act==='hourview'){ui.hourView=true;openSheet();return}
  if(d.act==='handover'){ui.handover=true;openSheet();return}
  if(d.act==='addissue'){const tx=($('#isText').value||'').trim();if(!tx){$('#isText').focus();return}S.issues.push({id:uid(),house:+$('#isHouse').value,text:tx,date:ui.date,ts:Date.now(),done:false});persist();showSheet();return}
  if(d.isdone){S.issues.forEach(i=>{if(i.id===d.isdone){i.done=true;i.doneTs=Date.now()}});persist();showSheet();return}
  if(d.isreopen){S.issues.forEach(i=>{if(i.id===d.isreopen){i.done=false;delete i.doneTs}});persist();showSheet();return}
  if(d.act==='hocopy'){copyInto(handoverText(ui.date,ui.shift),$('#hoBox'),$('#hoMsg'));return}
  if(d.side){ui.side=d.side;showSheet();return}
  if(d.goh){const L=pagesList(),x=L.find(y=>y.h===+d.goh&&y.sd===(ui.side==='h'&&+d.goh!==8?'c':ui.side))||L.find(y=>y.h===+d.goh);if(x){ui.open=x.h;ui.side=x.sd;showSheet();const sh=$('.sheet');if(sh)sh.scrollTop=0}return}
  if(d.pg!==undefined){goPage(+d.pg);return}
  if(d.act==='tgtfix'){const r=rec(ui.date,sk()),v=has(r.target)?num(r.target):defTarget(ui.open,ui.side);if(!(v>0)){flashMsg('اكتب رقم المطلوب الأول');return}S.settings.houses[ui.open-1]['tgt'+ui.side.toUpperCase()]=String(v);persist();refreshDay();flashMsg('اتحفظ كمطلوب ثابت: '+fmtN(v)+' بيضة');return}
  if(d.hr){ui.hour=+d.hr;showSheet();return}
  if(d.opend){ui.date=d.opend;ui.tab='home';ui.shift='day';render();window.scrollTo(0,0);return}
  if(d.act==='report'){const box=$('#repBox'),m=$('#repMsg');copyInto(reportText(ui.date,ui.shift),box,m);return}
  if(t.classList.contains('mic')){toggleMic(t);return}
  if(t.id==='lockGo'){if(!tryUnlock()){const m=$('#lockMsg');if(m){m.style.color='var(--bad)';m.textContent='الرقم غلط'}}return}
  if(d.act==='mkcode'){makeCode().then(c=>{const ta=$('#sendCode');ta.value=c;ta.select();const m=$('#sendMsg');try{navigator.clipboard.writeText(c).then(()=>{m.textContent='تم النسخ ✓ الصقه في واتساب أو ملاحظات'},()=>{m.textContent='اضغط على الكود وانسخه'})}catch(x){m.textContent='اضغط على الكود وانسخه'}});return}
  if(d.act==='rcvread'){rcvAnalyze();return}
  if(d.act==='rcvapply'){rcvApply(d.over==='1');return}
  if(d.act==='bkfile'){bkDownload();render();return}
  if(d.act==='bkshare'){bkShare().then(()=>render());return}
  if(d.lvl){const q=d.lvl.split(':'),w=S.settings.workers[+q[0]];if(w){w.lvl=q[1];persist();render()}return}
  if(d.cm){const q=d.cm.split(':'),c=S.settings.crews[+q[0]];if(c){c.members=c.members||[];const k=c.members.indexOf(q[1]);if(k>=0)c.members.splice(k,1);else c.members.push(q[1]);persist();render()}return}
  if(d.act==='addw'){const i=$('#wNew'),v=(i.value||'').trim();if(!v){i.focus();return}S.settings.workers.push({id:uid(),name:v,lvl:$('#wLvl').value,off:{from:'',to:''}});persist();render();return}
  if(d.act==='addcrew'){const i=$('#cNew'),v=(i.value||'').trim();if(!v){i.focus();return}S.settings.crews.push({name:v,members:[]});if(!S.settings.crewRot.date)S.settings.crewRot={date:today(),idx:0};persist();render();return}
  if(d.pendel){S.settings.penalties=S.settings.penalties.filter(x=>x.id!==d.pendel);persist();render();return}
  if(d.act==='penadd'){const f=$('#penFrom').value||today();S.settings.penalties.push({id:uid(),w:$('#penW').value,from:f,days:+$('#penD').value});persist();render();return}
  if(d.act==='swapadd'){const o=$('#swOut').value,n=$('#swIn').value;if(!o||!n)return;S.crewMod[ui.date]=(S.crewMod[ui.date]||[]).concat([{out:o,'in':n}]);persist();render();return}
  if(d.swdel){(S.crewMod[ui.date]||[]).splice(+d.swdel,1);persist();render();return}
  if(d.act==='wakeok'){stopWake();return}
  if(d.act==='wakesnz'){const sd=d.sd||today();stopWake();setTimeout(()=>startWake(sd),10*60000);return}
  if(d.act==='waketest'){startWake(today());return}
  if(d.lk){lockAction(d.lk);return}
  if(d.act==='pinedit'){ui.pinEdit=true;render();return}
  if(d.act==='pinset'){
    const v=($('#pinNew').value||'').trim(),m=$('#pinMsg'),sel=$('#pinQsel').value,q=(sel||$('#pinQown').value||'').trim(),a=$('#pinAns').value||'';
    const bad=t=>{m.style.color='var(--bad)';m.textContent=t};
    if(!/^\d{4,6}$/.test(v))return bad('اكتب رقم من 4 إلى 6 أرقام');
    if(q.length<3)return bad('اكتب سؤال الاسترجاع');
    if(normA(a).length<2)return bad('اكتب إجابة السؤال');
    S.settings.pin=hashPin(v);S.settings.pinQ=q;S.settings.pinA=hashA(a);ui.pinEdit=false;persist();render();return}

  if(d.act==='repopen'){openReport();return}
  if(d.act==='repclose'){if(history.state&&history.state.rep)history.back();else closeReport();return}
  if(d.act==='repprint'){window.print();return}
  if(d.rn){ui.rn=+d.rn;const v=$('#repView');if(v){const y=v.scrollTop;openReport();v.scrollTop=y}return}
  if(d.chr){ui.ch.range=+d.chr;drawCharts();return}
  /*rm*/
  /*rm*/
  /*rm*/
  /*rm*/
  if(d.act==='crewreset'){delete S.feedCrew[ui.date];persist();render();return}
  if(d.act==='engreset'){delete S.feedEng[ui.date];persist();render();return}
  if(d.tchk){
    const tk=S.settings.tasks.find(x=>x.id===d.tchk),st=todoGet(ui.date,tk.id,true),done=taskDone(tk,ui.date);
    if(tk.perHouse){taskHouses(tk).forEach(i=>{st.h[i]=!done})}else st.all=!done;
    persist();const el=$('[data-task="'+tk.id+'"]');if(el)el.outerHTML=taskHTML(tk);renderNav();return}
  if(d.th){
    const p=d.th.split(':'),tk=S.settings.tasks.find(x=>x.id===p[0]),st=todoGet(ui.date,tk.id,true);
    st.h[+p[1]]=!st.h[+p[1]];persist();const el=$('[data-task="'+tk.id+'"]');if(el)el.outerHTML=taskHTML(tk);renderNav();return}
  if(d.act==='addtask'){S.settings.tasks.push({id:'t'+uid(),label:'مهمة جديدة',shift:ui.shift,perHouse:false,times:[],on:true});persist();render();return}
  if(d.act==='addeng'){const i=$('#engNew'),v=(i.value||'').trim();if(!v){i.focus();return}S.settings.engineers.push(v);if(!S.settings.rot.date){S.settings.rot={date:today(),idx:0}}persist();render();return}
  if(d.act==='addcur'){S.settings.curtain.push({f:'',cm:''});persist();render();return}
  if(d.kind){$$('#tkind button').forEach(b=>b.setAttribute('aria-pressed',b===t));return}
  if(d.tdone){S.treat.forEach(x=>{if(x.id===d.tdone)x.done=true});persist();renderTList();return}
  if(d.tundo){S.treat.forEach(x=>{if(x.id===d.tundo){x.done=false;delete S.fired['tr-due-'+x.id]}});persist();renderTList();return}
  if(t.id==='tApply'){const v=$('#tAll').value;$$('[data-q]').forEach(i=>{i.value=v});return}
  if(t.id==='tAdd'){
    const name=$('#tName').value.trim(),msg=$('#tMsg');
    if(!name){msg.textContent='اكتب الاسم الأول';msg.style.color='var(--bad)';return}
    const q={};$$('[data-q]').forEach(i=>{if(i.value!=='')q[i.getAttribute('data-q')]=i.value});
    if(!Object.keys(q).length){msg.textContent='حدد كمية لعنبر واحد على الأقل';msg.style.color='var(--bad)';return}
    S.treat.push({id:uid(),kind:$('#tkind [aria-pressed="true"]').getAttribute('data-kind'),name:name,date:$('#tDate').value,time:$('#tTime').value||'08:00',unit:$('#tUnit').value,remind:$('#tRemind').value,q:q,note:$('#tNote').value.trim(),done:false});
    persist();$('#tName').value='';$('#tNote').value='';$$('[data-q]').forEach(i=>{i.value=''});$('#tAll').value='';
    msg.textContent='تمت الإضافة ✓';msg.style.color='var(--ok)';renderTList();tick();return}
  if(d.copy){const m=$('#cpmsg');copyInto(d.copy==='json'?JSON.stringify(S):d.copy==='day'?dailyCSV():eveCSV(),$('#bk'),m);return}
  if(t.id==='wake'){
    const msg=$('#wakeMsg');
    if(window.__wl){try{window.__wl.release()}catch(x){}window.__wl=null;msg.textContent='اتلغت';return}
    try{if(!navigator.wakeLock){msg.textContent='المتصفح لا يدعم ده';return}navigator.wakeLock.request('screen').then(l=>{window.__wl=l;msg.textContent='الشاشة هتفضل شغالة والتطبيق ظاهر';l.addEventListener('release',()=>{window.__wl=null})}).catch(()=>{msg.textContent='مش متاح دلوقتي'})}catch(x){msg.textContent='مش متاح دلوقتي'}
    return}
  if(t.id==='notif'){const nm=$('#notifMsg');try{if(!('Notification' in window)){nm.textContent='المتصفح لا يدعم الإشعارات';return}Notification.requestPermission().then(p=>{nm.textContent=p==='granted'?'تم التفعيل ✓':'لم يتم السماح بالإشعارات'})}catch(x){nm.textContent='غير متاح'}return}
  if(t.id==='upd'){
    $('#updMsg').textContent='جاري التحديث...';
    const jobs=[],go=()=>location.replace(location.pathname+'?u='+Date.now());
    try{if(navigator.serviceWorker)jobs.push(navigator.serviceWorker.getRegistrations().then(rs=>Promise.all(rs.map(r=>r.unregister()))))}catch(x){}
    try{if(window.caches)jobs.push(caches.keys().then(ks=>Promise.all(ks.map(k=>caches.delete(k)))))}catch(x){}
    Promise.all(jobs).then(go,go);return}
});
document.addEventListener('input',e=>{
  const el=e.target;
  if(el.matches('[data-xk]')){const r=evxRec(ui.date,+el.dataset.house,true),k=el.dataset.xk;if(el.value==='')delete r[k];else r[k]=el.value;persistSoon();return}
  if(el.matches('[data-xh]')){const q=el.dataset.xh.split(':'),r=evxRec(ui.date,+q[1],true);if(el.value==='')delete r[q[0]];else r[q[0]]=el.value;el.classList.toggle('bad',el.value!==''&&parseDur(el.value)===null);const t=$('#xtot'+q[1]);if(t){t.textContent=runsTxt(r)||'—';t.className='pill'+(runsTxt(r)?' ok':'')}persistSoon();return}
  if(el.id==='lockIn'){tryUnlock();return}
  if(el.matches('[data-ho]')){const k=ui.date+':'+ui.shift;S.handover[k]=S.handover[k]||{};S.handover[k][el.dataset.ho]=el.value;persistSoon();return}
  if(el.matches('[data-k]')&&ui.open){
    const k=el.getAttribute('data-k'),r=rec(ui.date,SHARED[k]?String(ui.open):sk(),true);
    if(!SHARED[k]&&k!=='target'&&ui.side!=='h'&&!has(r.target)&&defTarget(ui.open,ui.side)>0)r.target=String(defTarget(ui.open,ui.side));
    if(el.value==='')delete r[k];else r[k]=el.value;
    persistSoon();refreshDay();
  }else if(el.matches('[data-ek]')){
    const h=+el.dataset.house,hour=+el.dataset.hour,r=eveRec(ui.date,hour,h,true),k=el.getAttribute('data-ek'),v=el.type==='checkbox'?(el.checked?'1':''):el.value;
    if(v==='')delete r[k];else r[k]=v;
    if(k==='htr'&&el.checked&&!has(r.heaters)){const hi=$('[data-ek="heaters"][data-house="'+h+'"][data-hour="'+hour+'"]');if(hi)hi.focus()}
    persistSoon();ui.hourView?refreshHourView():refreshEveSheet();
  }else if(el.matches('[data-ak]')){
    const hour=HOURS[ui.hour];ui.all[hour]=ui.all[hour]||{};const av=el.type==='checkbox'?(el.checked?'1':''):el.value;
    if(av==='')delete ui.all[hour][el.dataset.ak];else ui.all[hour][el.dataset.ak]=av;
    refreshHourView();
  }else if(el.matches('[data-path]')){
    const ty=el.dataset.type,path=el.dataset.path;
    let val=el.type==='checkbox'?el.checked:el.value;
    if(ty==='times')val=String(val).split(/[,،\s]+/).filter(Boolean);
    setPath(path,val);persistSoon();
  }
});
document.addEventListener('change',e=>{
  const el=e.target;
  if(el.matches('[data-xd]')){const r=evxRec(ui.date,+el.dataset.xd,true);if(el.checked){r.hd='';}else{r.hd='1';if(!has(r.h2)&&has(r.h1))r.h2=r.h1}persist();reshow();return}
  if(el.matches('[data-xh]')){const q=el.dataset.xh.split(':'),r=evxRec(ui.date,+q[1],true),v=parseDur(el.value);if(v!==null){r[q[0]]=durTxt(v);el.value=r[q[0]];persist()}return}
  if(el.matches('[data-cp]')){const k=ui.date+'|'+el.dataset.cp;if(el.checked)S.copied[k]=1;else delete S.copied[k];persist();const tr=el.closest('tr');if(tr)tr.classList.toggle('done',el.checked);return}
  if(el.id==='dDate'){if(el.value){ui.date=el.value;render()}return}
  if(el.id==='engSel'){S.feedEng[ui.date]=el.value;persist();render();return}
  if(el.id==='pinQsel'){const o=$('#pinQown');if(o)o.hidden=el.value!=='';return}
  if(el.id==='crewSel'){S.feedCrew[ui.date]=el.value;persist();render();return}
  if(el.id==='crewRotSel'){S.settings.crewRot={date:today(),idx:+el.value};persist();render();return}
  if(el.id==='chScope'){ui.ch.scope=+el.value;drawCharts();return}
  if(el.id==='rcvpick'){const f=el.files&&el.files[0];if(!f)return;const fr=new FileReader();fr.onload=()=>{$('#rcvText').value=String(fr.result||'');rcvAnalyze()};fr.readAsText(f);return}
  if(el.id==='bkpick'){const f=el.files&&el.files[0];if(!f)return;const fr=new FileReader();fr.onload=()=>{$('#rs').value=String(fr.result||'');const m=$('#rsmsg');m.style.color='';m.textContent='تم قراءة الملف. اضغط "استعادة" مرتين للتأكيد.'};fr.readAsText(f);return}
  if(el.id==='rotSel'){S.settings.rot={date:today(),idx:+el.value};persist();render();return}
  if(el.matches('[data-path]')&&(el.tagName==='SELECT'||el.type==='checkbox')){
    const path=el.dataset.path;setPath(path,el.type==='checkbox'?el.checked:el.value);persist();
    if(/^tasks\./.test(path)||path==='sound')render();return}
  if(el.matches('[data-ek="tin"],[data-ek="fans"],[data-ek="heaters"],[data-ek="htr"]')){checkEve(+el.dataset.house,+el.dataset.hour);return}
  if(el.matches('[data-k="tmax"]')&&ui.open)checkDayHeat(ui.open,el.value);
});
document.addEventListener('visibilitychange',()=>{if(!document.hidden)tick()});
document.addEventListener('visibilitychange',()=>{if(document.hidden)hiddenAt=Date.now();else if(S.settings.pin&&hiddenAt&&Date.now()-hiddenAt>60000)showLock()});

render();flash();tick();sclock();if(S.settings.pin)showLock();
setInterval(tick,15000);
})();
</script>

  var hadCtl=!!navigator.serviceWorker.controller,reloaded=false;
  navigator.serviceWorker.addEventListener('controllerchange',function(){if(hadCtl&&!reloaded){reloaded=true;location.reload()}});
  window.addEventListener('load',function(){navigator.serviceWorker.register('sw.js',{updateViaCache:'none'}).then(function(r){try{r.update()}catch(e){}}).catch(function(){})});
}
