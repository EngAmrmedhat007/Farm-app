<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>متابعة المزرعة</title>
<meta name="theme-color" content="#1E6B50">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0}
[hidden]{display:none!important}
img{max-width:100%}
</style>
<style>
/* Layout: عمود واحد للموبايل، شريط تنقل سفلي ثابت، شريط علوي ثابت فيه الجرس والتاريخ.
   Palette: حبر أخضر داكن للنص، سطح رمادي مخضر، أخضر حقل كلون أساسي، حالات منفصلة (سليم/تنبيه/خطر). */
:root{
  --bg:#EDF0EA; --surface:#FAFBF8; --surface2:#E2E8DF; --fg:#17261E; --muted:#56675D; --line:#C9D2C5;
  --accent:#1E6B50; --accent-fg:#FFFFFF; --accent-soft:#D7E9DF;
  --ok:#2E7D32; --okbg:#E1F0E2; --warn:#A35F00; --warnbg:#FFF0D2; --bad:#B3261E; --badbg:#FCE3E0;
  --font:"IBM Plex Sans Arabic","Noto Sans Arabic",Tahoma,system-ui,sans-serif;
  --display:"Reem Kufi","IBM Plex Sans Arabic",Tahoma,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0F1713; --surface:#16211B; --surface2:#1E2C24; --fg:#E6EEE8; --muted:#93A69A; --line:#2D3F34;
    --accent:#5CC59A; --accent-fg:#06241A; --accent-soft:#1B3A2D;
    --ok:#7CCB82; --okbg:#17321B; --warn:#F0B04A; --warnbg:#3A2C10; --bad:#FF8A80; --badbg:#3E1B18;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0F1713; --surface:#16211B; --surface2:#1E2C24; --fg:#E6EEE8; --muted:#93A69A; --line:#2D3F34;
  --accent:#5CC59A; --accent-fg:#06241A; --accent-soft:#1B3A2D;
  --ok:#7CCB82; --okbg:#17321B; --warn:#F0B04A; --warnbg:#3A2C10; --bad:#FF8A80; --badbg:#3E1B18;
  color-scheme:dark;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  background:var(--bg); color:var(--fg); font-family:var(--font); font-size:15px; line-height:1.55;
  direction:rtl; margin:0;
  padding-left:max(16px, env(safe-area-inset-left, 0px));
  padding-right:max(16px, env(safe-area-inset-right, 0px));
  padding-block:0 96px;
}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--surface)}
.wrap{max-width:720px;margin:0 auto}
button,input,select,textarea{font:inherit;color:inherit}
h2{font-size:17px;margin:0 0 10px;font-weight:600;text-wrap:balance}
h3{font-size:14px;margin:0 0 8px;font-weight:600;color:var(--muted);letter-spacing:.02em}
.muted{color:var(--muted)}
.small{font-size:12.5px}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:25;background:var(--surface);
  margin-inline:calc(-1 * max(16px, env(safe-area-inset-right, 0px))) calc(-1 * max(16px, env(safe-area-inset-left, 0px)));
  padding:10px max(16px, env(safe-area-inset-right, 0px)) 10px max(16px, env(safe-area-inset-left, 0px));
  border-bottom:1px solid var(--line)}
.top .row{display:flex;align-items:center;gap:12px;max-width:720px;margin:0 auto}
.brand{flex:1;min-width:0}
.brand b{font-family:var(--display);font-size:21px;font-weight:600;display:block;line-height:1.2}
.brand span{font-size:12.5px;color:var(--muted)}
.brand .by{display:block;font-family:var(--display);color:var(--accent);font-size:13.5px;font-weight:600}
.sigf{text-align:center;color:var(--muted);font-size:13px;padding:22px 0 4px}
.sigf b{font-family:var(--display);color:var(--accent);font-size:15px;font-weight:600}
.eg{color:var(--accent);font-weight:600;min-height:18px;text-align:center;font-variant-numeric:tabular-nums}
.bell{position:relative;min-width:46px;min-height:46px;border-radius:12px;border:1px solid var(--line);background:var(--surface2);cursor:pointer;font-size:20px}
.bell i{position:absolute;top:-6px;inset-inline-start:-6px;background:var(--bad);color:#fff;border-radius:99px;font-style:normal;font-size:12px;min-width:20px;height:20px;line-height:20px;text-align:center;padding:0 5px;font-weight:700}

/* banner + alert panel */
#banner{display:flex;flex-direction:column;gap:8px;margin:10px 0 0}
.alert{display:flex;gap:10px;align-items:flex-start;border-radius:12px;padding:12px;border:1px solid var(--line);background:var(--surface)}
.alert.bad{background:var(--badbg);border-color:var(--bad)}
.alert.warn{background:var(--warnbg);border-color:var(--warn)}
.alert.info{background:var(--accent-soft);border-color:var(--accent)}
.alert p{margin:0;flex:1;min-width:0;font-weight:500}
.alert time{display:block;font-size:12px;color:var(--muted);font-weight:400}
.alert button{min-height:40px}
#panel{margin-top:10px}

/* generic */
main{padding-top:12px;display:flex;flex-direction:column;gap:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px}
.btn{min-height:44px;padding:8px 16px;border-radius:10px;border:1px solid var(--line);background:var(--surface2);cursor:pointer;font-weight:500}
.btn.primary{background:var(--accent);color:var(--accent-fg);border-color:var(--accent);font-weight:600}
.btn.danger{color:var(--bad);border-color:var(--bad);background:transparent}
.btn.sm{min-height:38px;padding:4px 12px;font-size:14px}
.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.spread{justify-content:space-between}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 8px;scrollbar-width:thin}
.chip{flex:0 0 auto;min-width:64px;min-height:46px;padding:6px 14px;border-radius:12px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-weight:500;position:relative}
.chip[aria-pressed="true"]{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.chip .dot{position:absolute;top:5px;inset-inline-end:6px;width:8px;height:8px;border-radius:50%;background:var(--ok)}
.seg{display:flex;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--surface)}
.seg button{flex:1;min-height:44px;border:0;background:transparent;cursor:pointer;font-weight:500}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-fg)}
.g2,.g3,.g4{display:grid;gap:10px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g1{display:grid;gap:10px;grid-template-columns:minmax(0,1fr)}
label.f{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted);min-width:0}
label.f span{font-weight:500}
input[type=text],input[type=number],input[type=date],input[type=time],select,textarea{
  width:100%;min-height:46px;padding:8px 10px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--fg);font-size:16px;min-width:0}
input[type=number]{text-align:center;font-variant-numeric:tabular-nums}
textarea{min-height:90px;font-size:14px;direction:ltr;text-align:left}
input::placeholder,textarea::placeholder{color:var(--muted);opacity:.65}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(104px,1fr));gap:8px}
.tile{background:var(--surface2);border-radius:12px;padding:10px 12px;min-width:0}
.tile b{display:block;font-size:22px;font-variant-numeric:tabular-nums;line-height:1.2}
.tile .sub{display:block;color:var(--fg);font-weight:600;font-size:13px}
.tile span{font-size:12.5px;color:var(--muted)}
.tile.ok b{color:var(--ok)} .tile.bad b{color:var(--bad)} .tile.warn b{color:var(--warn)}
.pill{display:inline-block;border-radius:99px;padding:2px 10px;font-size:12.5px;font-weight:600;background:var(--surface2)}
.pill.ok{background:var(--okbg);color:var(--ok)} .pill.bad{background:var(--badbg);color:var(--bad)} .pill.warn{background:var(--warnbg);color:var(--warn)}
.sec{display:flex;flex-direction:column;gap:10px}
.saved{font-size:12.5px;color:var(--ok);min-height:18px}
.tablebox{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
table{border-collapse:collapse;width:100%;min-width:640px;font-variant-numeric:tabular-nums}
th,td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:center;font-size:14px;white-space:nowrap}
th{background:var(--surface2);font-weight:600;position:sticky;top:0}
td small{display:block;color:var(--muted);font-size:11.5px}
td.hot{background:var(--badbg);color:var(--bad);font-weight:600}
tr:last-child td{border-bottom:0}
.hcard{border:1px solid var(--line);border-radius:12px;padding:12px;background:var(--surface);display:flex;flex-direction:column;gap:8px}
.sub{border-top:1px dashed var(--line);padding-top:10px;display:flex;flex-direction:column;gap:8px}
.sub h4{margin:0;font-size:14px;color:var(--accent);font-weight:700}
.hcard header{display:flex;justify-content:space-between;align-items:center}
.hcard header b{font-size:16px}
.kv{display:flex;justify-content:space-between;gap:8px;padding:7px 0;border-bottom:1px dashed var(--line);font-variant-numeric:tabular-nums}
.kv:last-child{border-bottom:0}
.titem{display:flex;flex-direction:column;gap:6px;padding:12px;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
.titem.late{border-color:var(--bad);background:var(--badbg)}
.titem.done{opacity:.6}
.qty{display:flex;flex-wrap:wrap;gap:6px}
.qty span{background:var(--surface2);border-radius:8px;padding:2px 8px;font-size:13px;font-variant-numeric:tabular-nums}
details.card>summary{cursor:pointer;font-weight:600;min-height:32px;display:flex;align-items:center}
nav.bottom{position:fixed;bottom:0;left:0;right:0;z-index:25;background:var(--surface);border-top:1px solid var(--line);
  padding:6px max(8px, env(safe-area-inset-right, 0px)) calc(6px + env(safe-area-inset-bottom, 0px)) max(8px, env(safe-area-inset-left, 0px))}
nav.bottom div{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;max-width:720px;margin:0 auto}
nav.bottom button{border:0;background:transparent;min-height:54px;border-radius:10px;cursor:pointer;font-size:12.5px;font-weight:500;color:var(--muted);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:2px}
nav.bottom button span{font-size:19px;line-height:1}
nav.bottom button[aria-current="page"]{background:var(--accent-soft);color:var(--accent);font-weight:700}
.empty{padding:22px 12px;text-align:center;color:var(--muted)}
@media (max-width:420px){ .g4{grid-template-columns:repeat(2,minmax(0,1fr))} .brand b{font-size:19px} }
@media (prefers-reduced-motion:no-preference){ .alert{animation:pop .25s ease-out} @keyframes pop{from{transform:translateY(-6px);opacity:.3}to{transform:none;opacity:1}} }
</style>

</head>
<body>
<div class="top" id="topbar"><div class="row">
  <div class="brand"><b>متابعة المزرعة</b><span id="subtitle"></span><span class="by">م/ عمرو مدحت</span></div>
  <button class="bell" id="bell" aria-label="التنبيهات">🔔<i id="bellN" hidden>0</i></button>
</div></div>
<div class="wrap">
  <div id="banner" aria-live="assertive"></div>
  <div id="panel" hidden></div>
  <main id="main"></main>
  <footer class="sigf">إعداد وتصميم: <b>م/ عمرو مدحت</b></footer>
</div>
<nav class="bottom"><div id="nav"></div></nav>

<script>
(function(){
'use strict';
var KEY='dakahlia_farm_v1';
var uid=function(){return Date.now().toString(36)+Math.random().toString(36).slice(2,6)};
var pad=function(n){return (n<10?'0':'')+n};
var isoDate=function(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())};
var esc=function(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})};
var num=function(v){var n=parseFloat(v);return isNaN(n)?0:n};
var has=function(v){return v!==undefined&&v!==null&&v!==''};
var $=function(s,r){return (r||document).querySelector(s)};
var $$=function(s,r){return Array.prototype.slice.call((r||document).querySelectorAll(s))};

/* ---------- state ---------- */
var houses=[];for(var i=1;i<=8;i++)houses.push({id:i,name:'عنبر '+i,hensC:'',hensF:'',fans:''});
var DEF={settings:{houses:houses,hot:30,
  steps:[{t:26,p:25},{t:28,p:50},{t:30,p:75},{t:32,p:100}],
  reminders:[
    {id:'nip',label:'تفقد خطوط النبل',times:['08:00','14:00','20:00'],on:true},
    {id:'floor',label:'تفقد السبل بالأرضية',times:['09:00','15:00','21:00'],on:true}],
  sound:true,tray:30},
  days:{},eve:{},treat:[],alerts:[],fired:{}};
var S,storageOK=true;
function load(){
  var raw=null;
  try{raw=JSON.parse(localStorage.getItem(KEY))}catch(e){storageOK=false}
  S=JSON.parse(JSON.stringify(DEF));
  if(raw&&typeof raw==='object'){
    ['days','eve','treat','alerts','fired'].forEach(function(k){if(raw[k])S[k]=raw[k]});
    if(raw.settings){for(var k in raw.settings)S.settings[k]=raw.settings[k]}
  }
  while(S.settings.houses.length<8)S.settings.houses.push({id:S.settings.houses.length+1,name:'عنبر '+(S.settings.houses.length+1),hensC:'',hensF:'',fans:''});
  S.settings.houses.forEach(function(H){if(H.hensC===undefined)H.hensC='';if(H.hensF===undefined)H.hensF=''});
}
var saveT=null;
function persist(){
  try{localStorage.setItem(KEY,JSON.stringify(S));storageOK=true}catch(e){storageOK=false}
}
function persistSoon(){clearTimeout(saveT);saveT=setTimeout(function(){persist();flash()},250)}
function flash(){var e=$('#savedmsg');if(e){e.textContent=storageOK?'تم الحفظ ✓':'التخزين غير متاح في هذا المتصفح، انسخ نسخة احتياطية من تبويب السجل';e.style.color=storageOK?'':'var(--bad)'}}
load();

var ui={side:'c',tab:'day',date:isoDate(new Date()),house:1,eveView:'in',hour:new Date().getHours(),panel:false};
var TABS=[['day','☀️','النهاري'],['eve','🌙','المسائي'],['treat','💉','العلاج'],['log','📋','السجل'],['set','⚙️','الإعدادات']];
var hname=function(id){return S.settings.houses[id-1].name||('عنبر '+id)};

/* ---------- alerts ---------- */
var audioCtx=null;
function unlockAudio(){try{if(!audioCtx){var C=window.AudioContext||window.webkitAudioContext;if(C)audioCtx=new C()}if(audioCtx&&audioCtx.state==='suspended')audioCtx.resume()}catch(e){}}
document.addEventListener('pointerdown',unlockAudio,{passive:true});
function beep(){
  if(!S.settings.sound)return;
  try{
    if(navigator.vibrate)navigator.vibrate([200,100,200,100,300]);
    if(!audioCtx)return;
    [0,0.25,0.5].forEach(function(dt,i){
      var o=audioCtx.createOscillator(),g=audioCtx.createGain();
      o.type='sine';o.frequency.value=i===2?1040:880;o.connect(g);g.connect(audioCtx.destination);
      var t=audioCtx.currentTime+dt;g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(0.3,t+0.02);g.gain.exponentialRampToValueAtTime(0.0001,t+0.2);
      o.start(t);o.stop(t+0.22);
    });
  }catch(e){}
}
function phoneNotify(text){
  try{
    if(!('Notification' in window)||Notification.permission!=='granted'||!navigator.serviceWorker)return;
    navigator.serviceWorker.ready.then(function(reg){reg.showNotification('متابعة المزرعة',{body:text,tag:'farm-'+Date.now(),icon:'icon-192.png',badge:'icon-192.png',vibrate:[200,100,200],lang:'ar',dir:'rtl'})}).catch(function(){});
  }catch(e){}
}
function pushAlert(key,text,level){
  if(key){if(S.fired[key])return;S.fired[key]=Date.now()}
  S.alerts.unshift({id:uid(),ts:Date.now(),text:text,level:level||'warn',read:false});
  if(S.alerts.length>100)S.alerts.length=100;
  var keys=Object.keys(S.fired);if(keys.length>600){keys.sort(function(a,b){return S.fired[a]-S.fired[b]}).slice(0,200).forEach(function(k){delete S.fired[k]})}
  persist();renderBanner();beep();phoneNotify(text);
}
function timeStr(ts){var d=new Date(ts);return pad(d.getHours())+':'+pad(d.getMinutes())+' - '+d.getDate()+'/'+(d.getMonth()+1)}
function renderBanner(){
  var un=S.alerts.filter(function(a){return !a.read});
  var n=$('#bellN');n.hidden=!un.length;n.textContent=un.length>99?'99+':un.length;
  var b=$('#banner');
  b.innerHTML=un.slice(0,2).map(function(a){return '<div class="alert '+a.level+'" role="alert"><p>'+esc(a.text)+'<time>'+timeStr(a.ts)+'</time></p><button class="btn sm" data-ack="'+a.id+'">تم</button></div>'}).join('')+
    (un.length>2?'<div class="small muted">و '+(un.length-2)+' تنبيهات أخرى في الجرس</div>':'');
  if(ui.panel)renderPanel();
}
function renderPanel(){
  var p=$('#panel');p.hidden=!ui.panel;if(!ui.panel)return;
  p.innerHTML='<div class="card sec"><div class="bar spread"><h2 style="margin:0">كل التنبيهات</h2><div class="bar"><button class="btn sm" data-act="readall">تم على الكل</button><button class="btn sm danger" data-confirm="clearalerts">مسح السجل</button></div></div>'+
   (S.alerts.length?S.alerts.slice(0,40).map(function(a){return '<div class="alert '+a.level+'" style="opacity:'+(a.read?.65:1)+'"><p>'+esc(a.text)+'<time>'+timeStr(a.ts)+'</time></p></div>'}).join(''):'<div class="empty">مفيش تنبيهات لسه</div>')+'</div>';
}

/* heat logic */
function fanAdvice(houseId,t){
  var steps=S.settings.steps.slice().filter(function(s){return has(s.t)&&has(s.p)}).sort(function(a,b){return a.t-b.t});
  var pick=null;steps.forEach(function(s){if(t>=num(s.t))pick=s});
  if(!pick)return '';
  var fans=num(S.settings.houses[houseId-1].fans),txt='المطلوب تشغيل نحو '+pick.p+'% من المراوح';
  if(fans>0)txt+=' ('+Math.ceil(fans*num(pick.p)/100)+' من '+fans+' مروحة)';
  return txt;
}
function checkHeat(houseId,t,tag){
  if(!has(t))return;t=num(t);
  var hot=num(S.settings.hot);
  if(t>=hot){
    var adv=fanAdvice(houseId,t);
    pushAlert('heat-'+tag+'-'+houseId,hname(houseId)+': الحرارة '+t+'° مرتفعة. '+(adv||'راجع عدد المراوح الشغالة')+'.','bad');
  }else{
    var steps=S.settings.steps.filter(function(s){return has(s.t)}).sort(function(a,b){return a.t-b.t});
    if(steps.length&&t>=num(steps[0].t)){
      pushAlert('heat-'+tag+'-'+houseId,hname(houseId)+': الحرارة '+t+'°. '+fanAdvice(houseId,t)+'.','warn');
    }
  }
}

/* ---------- timers: reminders + treatments ---------- */
function tick(){
  var now=new Date(),today=isoDate(now),nowMin=now.getHours()*60+now.getMinutes();
  S.settings.reminders.forEach(function(r){
    if(!r.on)return;
    (r.times||[]).forEach(function(t){
      var m=/^(\d{1,2}):(\d{2})$/.exec(String(t).trim());if(!m)return;
      var tm=num(m[1])*60+num(m[2]),diff=nowMin-tm;
      if(diff>=0&&diff<=15){
        pushAlert('rem-'+r.id+'-'+today+'-'+t,r.label+(diff>1?' (الموعد كان من '+diff+' دقيقة)':'')+' - '+t,'info');
      }
    });
  });
  S.treat.forEach(function(t){
    if(t.done)return;
    var due=new Date(t.date+'T'+t.time+':00').getTime();if(isNaN(due))return;
    var nowMs=now.getTime(),pre=due-num(t.remind)*60000;
    var kind=t.kind==='vaccine'?'تحصين':'علاج';
    if(nowMs>=due){
      var late=Math.round((nowMs-due)/60000);
      pushAlert('tr-due-'+t.id,'حان موعد '+kind+': '+t.name+(late>1?' (متأخر '+late+' دقيقة)':'')+'. الكميات: '+qtyText(t),'bad');
    }else if(num(t.remind)>0&&nowMs>=pre){
      pushAlert('tr-pre-'+t.id,'قرّب موعد '+kind+': '+t.name+' الساعة '+t.time+'. جهّز الكميات: '+qtyText(t),'warn');
    }
  });
  if(ui.tab==='treat')renderTList();
}
function qtyText(t){
  var out=[];for(var id in t.q){if(has(t.q[id]))out.push(hname(+id)+': '+t.q[id]+' '+t.unit)}
  return out.join('، ')||'لم تحدد';
}

/* ---------- daily ---------- */
var SIDES=[['c','تبريد'],['f','مراوح']];
var sname=function(x){return x==='c'?'التبريد':'المراوح'};
var SIDE_SECTIONS=[
 {title:'جمعات البيض (بالطبق)',cols:3,tray:true,hint:'الجمعات الثلاث كلها بيض صالح. اكتب عدد الأطباق في كل جمعة (الطبق = 30 بيضة) والتحويل لعدد البيض تلقائي.',f:[['c1','الجمعة الأولى'],['c2','الجمعة الثانية'],['c3','الجمعة الثالثة']]},
 {title:'المستبعدات من البيض (بالبيضة)',cols:4,hint:'تتسجل بالبيضة الواحدة، وبتتضاف على الصالح للوصول لإجمالي المجموع من الجانب.',f:[['dbl','دبل'],['defect','مشوه'],['broken','كسر'],['dead','هالك']]},
 {title:'النفوق',cols:2,f:[['mortM','نفوق ديوك'],['mortF','نفوق دجاج']]},
 {title:'الفرز',cols:2,f:[['cullM','فرز ديوك'],['cullF','فرز دجاج']]},
 {title:'العلف',cols:1,f:[['feed','العلف (كجم)']]}
];
var SHARED_SECTIONS=[
 {title:'درجة الحرارة (°م)',cols:2,step:'0.1',f:[['tmax','العظمى'],['tmin','الصغرى']]},
 {title:'المياه',cols:1,f:[['water','المياه (لتر)']]}
];
var SHARED={tmax:1,tmin:1,water:1};
function sk(){return ''+ui.house+ui.side}
function rec(date,h,create){
  if(!S.days[date]){if(!create)return {};S.days[date]={}}
  if(!S.days[date][h]){if(!create)return {};S.days[date][h]={}}
  return S.days[date][h];
}
function trayN(){return num(S.settings.tray)||30}
function trayParts(n){var T=trayN(),a=Math.abs(Math.round(n));return {t:Math.floor(a/T),e:a%T}}
function trayText(n){var q=trayParts(n);return fmtN(q.t)+' طبق'+(q.e?' و '+fmtN(q.e)+' بيضة':'')}
function calc(r){
  var good=(num(r.c1)+num(r.c2)+num(r.c3))*trayN(),x=num(r.dbl)+num(r.defect)+num(r.broken)+num(r.dead);
  return {c:good,x:x,tot:good+x,req:num(r.target),trays:num(r.c1)+num(r.c2)+num(r.c3)};
}
function hasData(date,h){var r=rec(date,h);for(var k in r)if(has(r[k]))return true;return false}
function houseHas(date,h){return hasData(date,h)||hasData(date,h+'c')||hasData(date,h+'f')}
function houseSum(date,h){
  var o={c:0,x:0,tot:0,req:0,trays:0,mort:0,mortM:0,mortF:0,cullM:0,cullF:0,feed:0,water:num(rec(date,h).water)};
  ['c','f'].forEach(function(sd){var q=rec(date,h+sd),k=calc(q);o.c+=k.c;o.x+=k.x;o.tot+=k.tot;o.req+=k.req;o.trays+=k.trays;o.mortM+=num(q.mortM);o.mortF+=num(q.mortF);o.mort+=num(q.mortM)+num(q.mortF)+num(q.mort);o.cullM+=num(q.cullM);o.cullF+=num(q.cullF);o.feed+=num(q.feed)});
  return o;
}
var fmtN=function(n){return Number(n).toLocaleString('en-US')};
function sumRows(o,withReq){
  var left=o.req-o.tot,rows=[];
  rows.push(['البيض المطلوب',fmtN(o.req)],['الصالح (بيضة)',fmtN(o.c)],['المستبعد (بيضة)',fmtN(o.x)],['الإجمالي المجموع (بيضة)',fmtN(o.tot)]);
  if(o.req>0)rows.push(['النسبة من المطلوب',(o.tot/o.req*100).toFixed(1).replace(/\.0$/,'')+'%'],[left>0?'متبقي للجمع':'زيادة عن المطلوب',trayText(left)]);
  rows.push(['إجمالي الأطباق',fmtN(o.trays)],['نفوق ديوك',fmtN(o.mortM)],['نفوق دجاج',fmtN(o.mortF)],['إجمالي النفوق',fmtN(o.mort)],['فرز ديوك',fmtN(o.cullM)],['فرز دجاج',fmtN(o.cullF)],['العلف (كجم)',fmtN(o.feed)],['المياه (لتر)',fmtN(o.water)]);
  if(o.feed>0&&o.water>0)rows.push(['مياه : علف',(o.water/o.feed).toFixed(2)]);
  return rows;
}
function kvHTML(rows){return rows.map(function(x){return '<div class="kv"><span>'+x[0]+'</span><b>'+x[1]+'</b></div>'}).join('')}
function secHTML(s,r){
  return '<div class="card sec"><h3>'+s.title+'</h3>'+(s.hint?'<div class="small muted">'+s.hint+'</div>':'')+'<div class="g'+s.cols+'">'+s.f.map(function(f){
    return '<label class="f"><span>'+f[1]+'</span><input type="number" inputmode="decimal" step="'+(s.step||'1')+'" data-k="'+f[0]+'" value="'+esc(has(r[f[0]])?r[f[0]]:'')+'">'+(s.tray?'<small class="eg" data-eg="'+f[0]+'"></small>':'')+'</label>'}).join('')+'</div></div>';
}
function renderDaily(){
  var m=$('#main'),rs=rec(ui.date,sk()),rh=rec(ui.date,ui.house);
  var chips=S.settings.houses.map(function(h){return '<button class="chip" data-house="'+h.id+'" aria-pressed="'+(ui.house===h.id)+'">'+esc(hname(h.id))+(houseHas(ui.date,h.id)?'<span class="dot"></span>':'')+'</button>'}).join('');
  var segs='<div class="seg" role="group" aria-label="الجانب">'+SIDES.map(function(x){return '<button data-side="'+x[0]+'" aria-pressed="'+(ui.side===x[0])+'">'+x[1]+(hasData(ui.date,ui.house+x[0])?' ●':'')+'</button>'}).join('')+'</div>';
  m.innerHTML=
   '<div class="bar spread"><label class="f" style="flex:1"><span>التاريخ</span><input type="date" id="dDate" value="'+ui.date+'"></label><div class="saved" id="savedmsg"></div></div>'+
   '<div class="chips" role="group" aria-label="العنابر">'+chips+'</div>'+segs+
   '<div class="card sec"><h3>جانب '+sname(ui.side)+' · '+esc(hname(ui.house))+'</h3><div class="small muted">البيض والنفوق والفرز والعلف بتتسجل لكل جانب لوحده.</div>'+
   '<label class="f"><span>إجمالي البيض المطلوب من جانب '+sname(ui.side)+'</span><input type="number" inputmode="numeric" min="0" data-k="target" placeholder="مثال: 3000" value="'+esc(has(rs.target)?rs.target:'')+'"></label>'+
   '<div class="tiles" id="dTiles"></div></div>'+
   SIDE_SECTIONS.map(function(s){return secHTML(s,rs)}).join('')+
   '<div class="card sec"><h2>بيانات العنبر كله</h2><div class="small muted">الحرارة والمياه موحدة للجانبين، فبتتسجل مرة واحدة لـ '+esc(hname(ui.house))+'.</div>'+
   SHARED_SECTIONS.map(function(s){return secHTML(s,rh)}).join('')+'</div>'+
   '<div class="card sec"><h3>إجمالي '+esc(hname(ui.house))+' (تبريد + مراوح)</h3><div id="hTotals"></div></div>'+
   '<div class="card sec"><h3>إجمالي المزرعة في هذا اليوم</h3><div id="dTotals"></div></div>';
  derivedDaily();
}
function derivedDaily(){
  var T=trayN(),rs=rec(ui.date,sk()),c=calc(rs),hens=num(S.settings.houses[ui.house-1]['hens'+ui.side.toUpperCase()]);
  ['c1','c2','c3'].forEach(function(k){var e=$('[data-eg="'+k+'"]');if(e)e.textContent=has(rs[k])?('= '+fmtN(num(rs[k])*T)+' بيضة'):''});
  var tiles=[['الصالح (بيضة)',fmtN(c.c),'ok'],['المستبعد (بيضة)',fmtN(c.x),c.x>0?'warn':''],['الإجمالي المجموع (بيضة)',fmtN(c.tot),'ok'],['عدد الأطباق',fmtN(c.trays),'']];
  if(c.req>0){var d=c.tot-c.req,pc=c.tot/c.req*100;tiles.push(['النسبة من المطلوب',pc.toFixed(1).replace(/\.0$/,'')+'%',d>=0?'ok':'warn']);var tp=trayParts(d);tiles.push([d>=0?'زيادة عن المطلوب (طبق)':'متبقي للجمع (طبق)',fmtN(tp.t),d>=0?'ok':'warn',tp.e?'و '+fmtN(tp.e)+' بيضة':''])}
  if(hens>0&&c.tot>0)tiles.push(['نسبة الإنتاج',(c.tot/hens*100).toFixed(1)+'%','']);
  $('#dTiles').innerHTML=tiles.map(function(x){return '<div class="tile '+x[2]+'"><b>'+x[1]+'</b><span>'+x[0]+(x[3]?' <strong class="sub">'+x[3]+'</strong>':'')+'</span></div>'}).join('');
  var hh=houseHas(ui.date,ui.house),rh=rec(ui.date,ui.house);
  var hrows=sumRows(houseSum(ui.date,ui.house));
  if(has(rh.tmax)||has(rh.tmin))hrows.push(['الحرارة العظمى / الصغرى',(has(rh.tmax)?rh.tmax:'-')+' / '+(has(rh.tmin)?rh.tmin:'-')]);
  $('#hTotals').innerHTML=hh?kvHTML(hrows):'<div class="empty">لسه مفيش بيانات للعنبر ده</div>';
  var sum={c:0,x:0,tot:0,req:0,trays:0,mort:0,mortM:0,mortF:0,cullM:0,cullF:0,feed:0,water:0},any=false;
  S.settings.houses.forEach(function(h){if(houseHas(ui.date,h.id))any=true;var o=houseSum(ui.date,h.id);for(var k in sum)sum[k]+=o[k]});
  $('#dTotals').innerHTML=any?kvHTML(sumRows(sum)):'<div class="empty">لسه مفيش بيانات اتسجلت في اليوم ده</div>';
}

/* ---------- evening ---------- */
function eveGet(date,hour,h,create){
  var k=pad(hour);
  if(!S.eve[date]){if(!create)return {};S.eve[date]={}}
  if(!S.eve[date][k]){if(!create)return {};S.eve[date][k]={}}
  if(!S.eve[date][k][h]){if(!create)return {};S.eve[date][k][h]={}}
  return S.eve[date][k][h];
}
function renderEve(){
  var m=$('#main');
  var head='<div class="bar spread"><label class="f" style="flex:1"><span>التاريخ</span><input type="date" id="eDate" value="'+ui.date+'"></label><div class="saved" id="savedmsg"></div></div>'+
    '<div class="seg"><button data-eview="in" aria-pressed="'+(ui.eveView==='in')+'">تسجيل الساعة</button><button data-eview="tbl" aria-pressed="'+(ui.eveView==='tbl')+'">جدول اليوم</button></div>';
  if(ui.eveView==='tbl'){m.innerHTML=head+eveTable();return}
  var hopts='';for(var h=0;h<24;h++)hopts+='<option value="'+h+'"'+(h===ui.hour?' selected':'')+'>'+pad(h)+':00</option>';
  var cards=S.settings.houses.map(function(H){
    var r=eveGet(ui.date,ui.hour,H.id);
    return '<div class="hcard" data-h="'+H.id+'"><header><b>'+esc(hname(H.id))+'</b><span class="pill" data-st></span></header>'+
     '<div class="g3"><label class="f"><span>الرطوبة %</span><input type="number" inputmode="decimal" data-ek="hum" placeholder="62" value="'+esc(has(r.hum)?r.hum:'')+'"></label>'+
     '<label class="f"><span>الحرارة داخل °</span><input type="number" inputmode="decimal" step="0.1" data-ek="tin" placeholder="28.5" value="'+esc(has(r.tin)?r.tin:'')+'"></label>'+
     '<label class="f"><span>الحرارة خارج °</span><input type="number" inputmode="decimal" step="0.1" data-ek="tout" placeholder="31" value="'+esc(has(r.tout)?r.tout:'')+'"></label></div>'+
     
     '<label class="f"><span>ملاحظات</span><input type="text" data-ek="note" value="'+esc(r.note||'')+'" placeholder="مثال: مروحة رقم 4 واقفة"></label></div>';
  }).join('');
  m.innerHTML=head+
   '<div class="card sec"><div class="bar"><button class="btn sm" data-hr="-1">الساعة السابقة</button><select id="eHour" style="flex:1;min-width:110px" aria-label="الساعة">'+hopts+'</select><button class="btn sm" data-hr="1">الساعة التالية</button><button class="btn sm" data-hr="now">الآن</button></div>'+
   '<div class="small muted">البيانات بتتسجل تحت الساعة المختارة. الخانات الفاضية مش بتتحسب. الأرقام اللي في الخانات مجرد أمثلة.</div></div>'+cards;
  $$('.hcard').forEach(statusPill);
}
function statusPill(card){
  var hId=+card.getAttribute('data-h'),r=eveGet(ui.date,ui.hour,hId),p=$('[data-st]',card);
  var filled=has(r.hum)||has(r.tin)||has(r.tout);
  if(!filled){p.textContent='لم يسجل';p.className='pill';return}
  var hot=has(r.tin)&&num(r.tin)>=num(S.settings.hot);
  p.textContent=hot?'حرارة مرتفعة':'مسجل';p.className='pill '+(hot?'bad':'ok');
}
function eveTable(){
  var d=S.eve[ui.date]||{},hrs=Object.keys(d).filter(function(k){return S.settings.houses.some(function(H){var r=d[k][H.id];return r&&(has(r.hum)||has(r.tin)||has(r.tout)||r.note)})});
  if(!hrs.length)return '<div class="card empty">مفيش تسجيلات مسائية في اليوم ده. سجل أول ساعة من تبويب "تسجيل الساعة".</div>';
  hrs.sort(function(a,b){var x=+a<12?+a+24:+a,y=+b<12?+b+24:+b;return x-y});
  var hot=num(S.settings.hot);
  var th='<tr><th>الساعة</th>'+S.settings.houses.map(function(H){return '<th>'+esc(hname(H.id))+'</th>'}).join('')+'</tr>';
  var body=hrs.map(function(k){
    return '<tr><th>'+k+':00</th>'+S.settings.houses.map(function(H){
      var r=d[k][H.id]||{};if(!(has(r.hum)||has(r.tin)||has(r.tout)))return '<td class="muted">-</td>';
      var h=has(r.tin)&&num(r.tin)>=hot;
      return '<td'+(h?' class="hot"':'')+'>'+(has(r.tin)?r.tin+'°':'-')+' · '+(has(r.hum)?r.hum+'%':'-')+(has(r.tout)?'<small>خارج '+r.tout+'°</small>':'')+'</td>';
    }).join('')+'</tr>';
  }).join('');
  var notes=[];
  hrs.forEach(function(k){S.settings.houses.forEach(function(H){var r=d[k][H.id];if(r&&r.note)notes.push('<div class="kv"><span>'+k+':00 · '+esc(hname(H.id))+'</span><span style="text-align:start">'+esc(r.note)+'</span></div>')})});
  return '<div class="small muted">كل خانة: الحرارة داخل · الرطوبة، وتحتها الحرارة خارج. اللون الأحمر يعني وصلت حد التنبيه ('+hot+'°).</div>'+
   '<div class="tablebox"><table><thead>'+th+'</thead><tbody>'+body+'</tbody></table></div>'+
   (notes.length?'<div class="card sec"><h3>ملاحظات الليلة</h3>'+notes.join('')+'</div>':'');
}

function renderTreat(){

   '</div></details><div class="sec" id="tlist"></div>';
  renderTList();
}
function renderTList(){
  var box=$('#tlist');if(!box)return;
  var now=Date.now();
  var list=S.treat.slice().sort(function(a,b){
    if(a.done!==b.done)return a.done?1:-1;
    return (a.date+a.time)<(b.date+b.time)?-1:1;
  });
  if(!list.length){box.innerHTML='<div class="card empty">مفيش تحصينات أو أدوية مسجلة. اضغط "إضافة" فوق وسجل أول موعد.</div>';return}
  box.innerHTML=list.map(function(t){
    var due=new Date(t.date+'T'+t.time+':00').getTime(),diff=Math.round((due-now)/60000),st,cls='';
    if(t.done){st='<span class="pill ok">تم</span>';cls='done'}
    else if(diff<0){st='<span class="pill bad">متأخر '+human(-diff)+'</span>';cls='late'}
    else st='<span class="pill warn">بعد '+human(diff)+'</span>';
    var qs='';for(var id in t.q){if(has(t.q[id]))qs+='<span>'+esc(hname(+id))+': '+esc(t.q[id])+' '+esc(t.unit)+'</span>'}
    return '<div class="titem '+cls+'"><div class="bar spread"><b>'+(t.kind==='vaccine'?'💉 ':'💊 ')+esc(t.name)+'</b>'+st+'</div>'+
     '<div class="small muted">'+t.date+' · '+t.time+(num(t.remind)>0?' · تنبيه قبلها '+human(num(t.remind)):'')+'</div>'+
     '<div class="qty">'+(qs||'<span>بدون كميات</span>')+'</div>'+(t.note?'<div class="small">'+esc(t.note)+'</div>':'')+
     '<div class="bar">'+(t.done?'<button class="btn sm" data-tundo="'+t.id+'">إرجاع</button>':'<button class="btn sm primary" data-tdone="'+t.id+'">تم التنفيذ</button>')+
     '<button class="btn sm danger" data-confirm="tdel:'+t.id+'">حذف</button></div></div>';
  }).join('');
}
function human(min){
  if(min<60)return min+' دقيقة';
  if(min<1440){var h=Math.floor(min/60),m=min%60;return h+' ساعة'+(m?' و '+m+' دقيقة':'')}
  var d=Math.floor(min/1440);return d+' يوم'+(d>2&&d<11?'':'')
}

/* ---------- log / backup ---------- */
function csvCell(v){v=String(v==null?'':v);return /[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v}
function dailyCSV(){
  var cols=['target','c1','c2','c3','dbl','defect','broken','dead','mortM','mortF','cullM','cullF','feed'];
  var rows=['التاريخ,العنبر,الجانب,المطلوب,جمعة1 طبق,جمعة2 طبق,جمعة3 طبق,دبل,مشوه,كسر,هالك,نفوق ديوك,نفوق دجاج,فرز ديوك,فرز دجاج,علف كجم,الصالح بيضة,الإجمالي بيضة,حرارة عظمى,حرارة صغرى,مياه لتر'];
  Object.keys(S.days).sort().forEach(function(d){S.settings.houses.forEach(function(H){
    SIDES.forEach(function(sd){
      if(!hasData(d,H.id+sd[0]))return;var r=rec(d,H.id+sd[0]),k=calc(r);
      rows.push([d,hname(H.id),sd[1]].concat(cols.map(function(c){return r[c]})).concat([k.c,k.tot,'','','']).map(csvCell).join(','));
    });
    if(hasData(d,H.id)){var q=rec(d,H.id);rows.push([d,hname(H.id),'العنبر كله','','','','','','','','','','','','','','','',q.tmax,q.tmin,q.water].map(csvCell).join(','))}
  })});
  return rows.join('\n');
}
function eveCSV(){
  var rows=['التاريخ,الساعة,العنبر,رطوبة,حرارة داخل,حرارة خارج,ملاحظات'];
  Object.keys(S.eve).sort().forEach(function(d){Object.keys(S.eve[d]).sort().forEach(function(k){S.settings.houses.forEach(function(H){
    var r=S.eve[d][k][H.id];if(!r)return;
    rows.push([d,k+':00',hname(H.id),r.hum,r.tin,r.tout,r.note].map(csvCell).join(','));
  })})});
  return rows.join('\n');
}
function renderLog(){
  var days=Object.keys(S.days).filter(function(d){return S.settings.houses.some(function(H){return houseHas(d,H.id)})}).sort().reverse().slice(0,30);
  var list=days.length?days.map(function(d){
    var c=0,x=0,mo=0;S.settings.houses.forEach(function(H){var o=houseSum(d,H.id);c+=o.tot;x+=o.x;mo+=o.mort});
    return '<button class="btn" style="text-align:start;display:flex;justify-content:space-between;gap:10px;width:100%" data-opend="'+d+'"><span>'+d+'</span><span class="muted small">إجمالي بيض '+fmtN(c)+' · منه مستبعد '+fmtN(x)+' · نافق '+fmtN(mo)+'</span></button>';
  }).join(''):'<div class="empty">لسه مفيش أيام مسجلة</div>';
  $('#main').innerHTML=
   '<div class="card sec"><h2>الأيام المسجلة</h2>'+list+'</div>'+
   '<div class="card sec"><h2>نسخة احتياطية</h2><div class="small muted">البيانات محفوظة في متصفح الموبايل ده بس. انسخ نسخة احتياطية كل فترة واحفظها في ملاحظات أو واتساب.</div>'+
   '<div class="bar"><button class="btn sm" data-copy="json">نسخ نسخة كاملة</button><button class="btn sm" data-copy="day">نسخ النهاري (Excel)</button><button class="btn sm" data-copy="eve">نسخ المسائي (Excel)</button></div>'+
   '<textarea id="bk" readonly placeholder="النص اللي هتنسخه بيظهر هنا"></textarea><div class="small" id="cpmsg"></div>'+
   '<h3>استعادة من نسخة</h3><textarea id="rs" placeholder="الصق هنا النسخة الكاملة"></textarea>'+
   '<div class="bar"><button class="btn sm danger" data-confirm="restore">استعادة (هتستبدل البيانات الحالية)</button><span class="small" id="rsmsg"></span></div></div>'+
   '<div class="card sec"><h2>مسح البيانات</h2><div class="small muted">يمسح كل التسجيلات والتنبيهات، ويفضل الإعدادات.</div><div><button class="btn danger" data-confirm="wipe">مسح كل التسجيلات</button></div></div>';
}

/* ---------- settings ---------- */
function renderSet(){
  var s=S.settings;
  var hs=s.houses.map(function(H,i){return '<div class="card sec" style="background:var(--bg)"><label class="f"><span>اسم العنبر</span><input type="text" data-hs="'+i+'.name" value="'+esc(H.name)+'"></label><div class="g3"><label class="f"><span>دجاج التبريد</span><input type="number" inputmode="numeric" data-hs="'+i+'.hensC" value="'+esc(H.hensC)+'"></label><label class="f"><span>دجاج المراوح</span><input type="number" inputmode="numeric" data-hs="'+i+'.hensF" value="'+esc(H.hensF)+'"></label><label class="f"><span>عدد المراوح</span><input type="number" inputmode="numeric" data-hs="'+i+'.fans" value="'+esc(H.fans)+'"></label></div></div>'}).join('');
  var st=s.steps.map(function(x,i){return '<div class="g2"><label class="f"><span>لو الحرارة ≥ °</span><input type="number" inputmode="decimal" step="0.5" data-st="'+i+'.t" value="'+esc(x.t)+'"></label><label class="f"><span>نسبة المراوح %</span><input type="number" inputmode="numeric" data-st="'+i+'.p" value="'+esc(x.p)+'"></label></div>'}).join('');
  var rm=s.reminders.map(function(r,i){return '<div class="card sec" style="background:var(--bg)"><label class="f"><span>نص التذكير</span><input type="text" data-rm="'+i+'.label" value="'+esc(r.label)+'"></label>'+
    '<label class="f"><span>المواعيد (ساعة:دقيقة، بينهم فاصلة)</span><input type="text" dir="ltr" data-rm="'+i+'.times" value="'+esc((r.times||[]).join(', '))+'"></label>'+
    '<div class="bar spread"><label class="bar"><input type="checkbox" data-rm="'+i+'.on" '+(r.on?'checked':'')+' style="width:22px;height:22px"> <span>مفعّل</span></label><button class="btn sm danger" data-confirm="rmdel:'+i+'">حذف</button></div></div>'}).join('');
  $('#main').innerHTML=
   '<div class="saved" id="savedmsg"></div>'+
   '<div class="card sec"><h2>العنابر</h2><div class="small muted">عدد الدجاج في كل جانب بيتستخدم في حساب نسبة الإنتاج، وعدد المراوح في تنبيه التهوية.</div><label class="f"><span>عدد البيض في الطبق</span><input type="number" inputmode="numeric" data-tray value="'+esc(s.tray)+'"></label>'+hs+'</div>'+
   '<div class="card sec"><h2>تنبيه الحرارة والمراوح</h2>'+
    '<label class="f"><span>حد الحرارة العالية (°م) داخل العنبر</span><input type="number" inputmode="decimal" step="0.5" data-hot value="'+esc(s.hot)+'"></label>'+
    '<h3>جدول المراوح حسب الحرارة</h3><div class="alert warn"><p class="small">الأرقام دي مبدئية للتجربة. عدّلها حسب برنامج التهوية المعتمد في الشركة وتعليمات المسؤول.</p></div>'+st+'</div>'+
   '<div class="card sec"><h2>التذكيرات الدورية</h2>'+rm+'<div><button class="btn" id="rmAdd">+ تذكير جديد</button></div></div>'+
   '<div class="card sec"><h2>الصوت والشاشة</h2><label class="bar"><input type="checkbox" id="snd" '+(s.sound?'checked':'')+' style="width:22px;height:22px"> <span>صوت واهتزاز مع التنبيه</span></label>'+
   '<div class="bar"><button class="btn" id="notif">تفعيل إشعارات الموبايل</button><span class="small muted" id="notifMsg"></span></div>'+
   '<div class="bar"><button class="btn" id="wake">إبقاء الشاشة شغالة</button><span class="small muted" id="wakeMsg"></span></div>'+
   '<div class="alert info"><p class="small">التنبيهات بتشتغل والتطبيق مفتوح على الشاشة. لو اتقفل أو الموبايل نام، التذكير اللي فات بيظهر أول ما تفتحه ثاني.</p></div></div>';
}
var wakeLock=null;
function toggleWake(){
  var msg=$('#wakeMsg');
  if(wakeLock){try{wakeLock.release()}catch(e){}wakeLock=null;msg.textContent='اتلغت';return}
  try{
    if(!navigator.wakeLock){msg.textContent='المتصفح لا يدعم ده';return}
    navigator.wakeLock.request('screen').then(function(l){wakeLock=l;msg.textContent='الشاشة هتفضل شغالة والتطبيق ظاهر';l.addEventListener('release',function(){wakeLock=null})}).catch(function(){msg.textContent='مش متاح دلوقتي'});
  }catch(e){msg.textContent='مش متاح دلوقتي'}
}

/* ---------- shell ---------- */
function renderNav(){
  $('#nav').innerHTML=TABS.map(function(t){return '<button data-tab="'+t[0]+'"'+(ui.tab===t[0]?' aria-current="page"':'')+'><span>'+t[1]+'</span>'+t[2]+'</button>'}).join('');
}
function render(){
  renderNav();
  var days=['الأحد','الاثنين','الثلاثاء','الأربعاء','الخميس','الجمعة','السبت'],n=new Date();
  $('#subtitle').textContent=days[n.getDay()]+' '+n.getDate()+'/'+(n.getMonth()+1)+'/'+n.getFullYear();
  ({day:renderDaily,eve:renderEve,treat:renderTreat,log:renderLog,set:renderSet})[ui.tab]();
  window.scrollTo(0,0);
}

/* ---------- confirmations ---------- */
var pending=null;
function askConfirm(btn,action){
  if(pending&&pending.btn===btn){clearTimeout(pending.t);var a=pending.action;btn.textContent=pending.label;pending=null;runConfirmed(a);return}
  if(pending){pending.btn.textContent=pending.label;clearTimeout(pending.t)}
  var label=btn.textContent;btn.textContent='اضغط ثاني للتأكيد';
  pending={btn:btn,action:action,label:label,t:setTimeout(function(){btn.textContent=label;pending=null},4000)};
}
function runConfirmed(a){
  var p=a.split(':');
  if(p[0]==='tdel'){S.treat=S.treat.filter(function(t){return t.id!==p[1]});persist();renderTList()}
  else if(p[0]==='clearalerts'){S.alerts=[];persist();renderBanner()}
  else if(p[0]==='rmdel'){S.settings.reminders.splice(+p[1],1);persist();renderSet()}
  else if(p[0]==='wipe'){S.days={};S.eve={};S.treat=[];S.alerts=[];S.fired={};persist();renderBanner();renderLog()}
  else if(p[0]==='restore'){
    var txt=($('#rs').value||'').trim(),msg=$('#rsmsg');
    try{var o=JSON.parse(txt);if(!o||typeof o!=='object'||!o.settings)throw 0;S=o;persist();load();persist();msg.textContent='تمت الاستعادة ✓';msg.style.color='var(--ok)';renderBanner()}
    catch(e){msg.textContent='النص غير صالح، انسخ النسخة كاملة';msg.style.color='var(--bad)'}
  }
}
function copyText(txt,msgEl){
  var ta=$('#bk');ta.value=txt;
  function fallback(){ta.focus();ta.select();msgEl.textContent='اضغط مطولًا على النص واختر نسخ'}
  try{navigator.clipboard.writeText(txt).then(function(){msgEl.textContent='اتنسخ ✓'}).catch(fallback)}catch(e){fallback()}
}

/* ---------- events ---------- */
document.addEventListener('click',function(e){
  var t=e.target.closest('button,summary');if(!t)return;
  var d=t.dataset||{};
  if(t.id==='bell'){ui.panel=!ui.panel;renderPanel();return}
  if(d.ack){S.alerts.forEach(function(a){if(a.id===d.ack)a.read=true});persist();renderBanner();return}
  if(d.act==='readall'){S.alerts.forEach(function(a){a.read=true});persist();renderBanner();return}
  if(d.confirm){askConfirm(t,d.confirm);return}
  if(d.tab){ui.tab=d.tab;ui.panel=false;renderPanel();render();return}
  if(d.side){ui.side=d.side;renderDaily();return}
  if(d.house){ui.house=+d.house;renderDaily();return}
  if(d.eview){ui.eveView=d.eview;renderEve();return}
  if(d.hr){
    if(d.hr==='now')ui.hour=new Date().getHours();else ui.hour=(ui.hour+ +d.hr+24)%24;
    renderEve();return}
  if(d.opend){ui.date=d.opend;ui.tab='day';render();return}
  if(d.kind){$$('#tkind button').forEach(function(b){b.setAttribute('aria-pressed',b===t)});return}
  if(d.tdone){S.treat.forEach(function(x){if(x.id===d.tdone)x.done=true});persist();renderTList();return}
  if(d.tundo){S.treat.forEach(function(x){if(x.id===d.tundo){x.done=false;delete S.fired['tr-due-'+x.id]}});persist();renderTList();return}
  if(t.id==='tApply'){var v=$('#tAll').value;$$('[data-q]').forEach(function(i){i.value=v});return}
  if(t.id==='tAdd'){
    var name=$('#tName').value.trim(),msg=$('#tMsg');
    if(!name){msg.textContent='اكتب الاسم الأول';msg.style.color='var(--bad)';return}
    var q={};$$('[data-q]').forEach(function(i){if(i.value!=='')q[i.getAttribute('data-q')]=i.value});
    if(!Object.keys(q).length){msg.textContent='حدد كمية لعنبر واحد على الأقل';msg.style.color='var(--bad)';return}
    var kind=$('#tkind [aria-pressed="true"]').getAttribute('data-kind');
    S.treat.push({id:uid(),kind:kind,name:name,date:$('#tDate').value,time:$('#tTime').value||'08:00',unit:$('#tUnit').value,remind:$('#tRemind').value,q:q,note:$('#tNote').value.trim(),done:false});
    persist();$('#tName').value='';$('#tNote').value='';$$('[data-q]').forEach(function(i){i.value=''});$('#tAll').value='';
    msg.textContent='تمت الإضافة ✓';msg.style.color='var(--ok)';renderTList();tick();return}
  if(d.copy){var m=$('#cpmsg');copyText(d.copy==='json'?JSON.stringify(S):d.copy==='day'?dailyCSV():eveCSV(),m);return}
  if(t.id==='rmAdd'){S.settings.reminders.push({id:uid(),label:'تذكير جديد',times:['12:00'],on:true});persist();renderSet();return}
  if(t.id==='wake'){toggleWake();return}
  if(t.id==='notif'){var nm=$('#notifMsg');try{if(!('Notification' in window)){nm.textContent='المتصفح لا يدعم الإشعارات';return}Notification.requestPermission().then(function(p){nm.textContent=p==='granted'?'تم التفعيل ✓':'لم يتم السماح بالإشعارات'})}catch(e){nm.textContent='غير متاح'}return}
});
document.addEventListener('input',function(e){
  var el=e.target;
  if(el.matches('[data-k]')){
    var k=el.getAttribute('data-k'),r=rec(ui.date,SHARED[k]?String(ui.house):sk(),true);
    if(el.value==='')delete r[k];else r[k]=el.value;
    persistSoon();derivedDaily();
    var dot=$('.chip[data-house="'+ui.house+'"]');if(dot&&!$('.dot',dot)&&houseHas(ui.date,ui.house)){var sp=document.createElement('span');sp.className='dot';dot.appendChild(sp)}
  }else if(el.matches('[data-ek]')){
    var card=el.closest('.hcard'),h=+card.getAttribute('data-h'),r2=eveGet(ui.date,ui.hour,h,true),k2=el.getAttribute('data-ek');
    if(el.value==='')delete r2[k2];else r2[k2]=el.value;
    persistSoon();statusPill(card);
  }else if(el.matches('[data-hs]')){
    var p=el.getAttribute('data-hs').split('.');S.settings.houses[+p[0]][p[1]]=el.value;persistSoon();
  }else if(el.matches('[data-st]')){
    var q=el.getAttribute('data-st').split('.');S.settings.steps[+q[0]][q[1]]=el.value;persistSoon();
  }else if(el.matches('[data-tray]')){S.settings.tray=el.value;persistSoon()}
  else if(el.matches('[data-hot]')){S.settings.hot=el.value;persistSoon()}
  else if(el.matches('[data-rm]')){
    var z=el.getAttribute('data-rm').split('.'),rr=S.settings.reminders[+z[0]];
    if(z[1]==='times')rr.times=el.value.split(/[,،\s]+/).filter(Boolean);
    else if(z[1]==='on')rr.on=el.checked;else rr.label=el.value;
    persistSoon();
  }else if(el.id==='snd'){S.settings.sound=el.checked;persistSoon()}
});
document.addEventListener('change',function(e){
  var el=e.target;
  if(el.id==='dDate'||el.id==='eDate'){if(el.value){ui.date=el.value;ui.tab==='day'?renderDaily():renderEve()}return}
  if(el.id==='eHour'){ui.hour=+el.value;renderEve();return}
  if(el.matches('[data-k="tmax"]')){checkHeat(ui.house,el.value,'max-'+ui.date)}
  if(el.matches('[data-ek="tin"]')){var h=+el.closest('.hcard').getAttribute('data-h');checkHeat(h,el.value,ui.date+'-'+ui.hour)}
  if(el.matches('[data-hs]')&&/\.name$/.test(el.getAttribute('data-hs')))persistSoon();
});
document.addEventListener('visibilitychange',function(){if(!document.hidden){tick();if(wakeLock===null&&false){}}});

render();renderBanner();flash();tick();
setInterval(tick,15000);
})();
</script>
<script>
if('serviceWorker' in navigator){window.addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){})})}
</script>
</body>
