<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>متابعة المزرعة</title>
<meta name="theme-color" content="#12301F">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Reem+Kufi:wght@500;600;700&display=swap">
<style>
:root{
  --bg:#EEF1EA; --surface:#FBFCF9; --surface2:#E5EBE0; --fg:#16241C; --muted:#5B6B61; --line:#CCD6C7;
  --brand:#1E6B50; --brand-fg:#FFFFFF; --brand-soft:#D6E8DE;
  --hero:#12301F; --hero2:#1D4D36; --hero-fg:#F2F6EF; --gold:#E0B04A;
  --ok:#2E7D32; --okbg:#E1F0E2; --warn:#9A5800; --warnbg:#FFF0D2; --bad:#B3261E; --badbg:#FCE3E0; --info:#1D5F8A; --infobg:#DDEBF5;
  --font:"IBM Plex Sans Arabic","Noto Sans Arabic",Tahoma,system-ui,sans-serif;
  --display:"Reem Kufi","IBM Plex Sans Arabic",Tahoma,sans-serif;
  --r:16px; color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0D1511; --surface:#16211B; --surface2:#1F2D25; --fg:#E6EEE8; --muted:#97A99D; --line:#2D3F34;
    --brand:#5CC59A; --brand-fg:#06241A; --brand-soft:#1B3A2D;
    --hero:#0A1F15; --hero2:#12301F; --hero-fg:#E9F2EB; --gold:#EBC067;
    --ok:#7CCB82; --okbg:#17321B; --warn:#F0B04A; --warnbg:#3A2C10; --bad:#FF8A80; --badbg:#3E1B18; --info:#7FBCE6; --infobg:#16303F;
    color-scheme:dark;
  }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--font);font-size:15px;line-height:1.55;direction:rtl;
  padding-bottom:calc(92px + env(safe-area-inset-bottom,0px))}
body.lock{overflow:hidden}
h1,h2,h3,h4{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
[hidden]{display:none!important}
:focus-visible{outline:3px solid var(--brand);outline-offset:2px}
.wrap{max-width:640px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.muted{color:var(--muted)} .small{font-size:13px} .num{font-variant-numeric:tabular-nums}

/* hero */
.hero{background:linear-gradient(160deg,var(--hero2),var(--hero));color:var(--hero-fg);padding:calc(14px + env(safe-area-inset-top,0px)) 0 22px;border-radius:0 0 28px 28px}
.hero.lite{padding-bottom:16px;border-radius:0 0 22px 22px}
.hrow{display:flex;align-items:center;gap:12px}
.logo{width:46px;height:46px;border-radius:50%;border:2px solid rgba(255,255,255,.35);flex:none;background:#fff}
.ht{flex:1;min-width:0}
.ht h1{font-family:var(--display);font-size:24px;font-weight:600;line-height:1.2}
.ht .by{font-size:12.5px;opacity:.8;color:var(--gold);font-weight:600}
.bell{position:relative;width:46px;height:46px;border-radius:14px;border:0;background:rgba(255,255,255,.12);font-size:20px;color:inherit}
.bell i{position:absolute;top:-6px;inset-inline-start:-6px;background:var(--bad);color:#fff;border-radius:99px;font-style:normal;font-size:12px;min-width:20px;height:20px;line-height:20px;text-align:center;padding:0 5px;font-weight:700}
.datebar{display:flex;gap:8px;align-items:center;margin-top:16px}
.datebar input{flex:1;min-width:0;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.2);color:var(--hero-fg);color-scheme:dark;text-align:center}
.datebar button{width:44px;height:46px;border-radius:12px;border:0;background:rgba(255,255,255,.12);color:inherit;font-size:18px}
.shiftseg{display:grid;grid-template-columns:1fr 1fr;gap:4px;margin-top:12px;background:rgba(255,255,255,.1);border-radius:14px;padding:4px}
.shiftseg button{border:0;border-radius:11px;min-height:44px;background:transparent;font-weight:600;color:inherit;opacity:.85}
.shiftseg button[aria-pressed="true"]{background:var(--hero-fg);color:var(--hero);opacity:1}
.sum{display:flex;align-items:center;gap:18px;margin-top:18px}
.ring{--p:0;width:98px;height:98px;flex:none;border-radius:50%;background:conic-gradient(var(--gold) calc(var(--p)*1%),rgba(255,255,255,.16) 0);display:grid;place-items:center;position:relative}
.ring::before{content:"";position:absolute;inset:9px;border-radius:50%;background:var(--hero)}
.ring b{position:relative;font-family:var(--display);font-size:21px}
.sum .lbl{font-size:13px;opacity:.78}
.sum .big{font-family:var(--display);font-size:40px;line-height:1.05;font-weight:600}
.sum .big small{font-size:17px;font-weight:500}
.mini{display:flex;gap:16px;margin-top:6px;font-size:12.5px;opacity:.9;flex-wrap:wrap}
.mini b{display:block;font-size:16px}

/* inputs */
input[type=text],input[type=number],input[type=date],input[type=time],select,textarea{
  width:100%;min-height:48px;padding:8px 12px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);color:var(--fg);font-size:16px;min-width:0}
input:focus,select:focus,textarea:focus{border-color:var(--brand)}
input[type=number]{text-align:center;font-variant-numeric:tabular-nums}
input[type=checkbox]{width:22px;height:22px;accent-color:var(--brand)}
textarea{min-height:90px;font-size:14px;direction:ltr;text-align:left}
input::placeholder,textarea::placeholder{color:var(--muted);opacity:.6}
label.f{display:flex;flex-direction:column;gap:4px;min-width:0}
label.f>span{font-size:13px;color:var(--muted);font-weight:500}
small.eg{color:var(--brand);font-weight:700;min-height:18px;text-align:center;font-size:12.5px;font-variant-numeric:tabular-nums}
.g2,.g3,.g4{display:grid;gap:10px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}.g4{grid-template-columns:repeat(4,minmax(0,1fr))}.g1{display:grid;gap:10px}
@media (max-width:420px){.g4{grid-template-columns:repeat(2,minmax(0,1fr))}}

/* buttons */
.btn{min-height:46px;padding:8px 18px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);font-weight:600}
.btn.primary{background:var(--brand);color:var(--brand-fg);border-color:var(--brand)}
.btn.danger{color:var(--bad);border-color:var(--bad);background:transparent}
.btn.sm{min-height:40px;padding:4px 14px;font-size:14px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.spread{justify-content:space-between}

/* sections */
.sec-t{display:flex;justify-content:space-between;align-items:baseline;margin:22px 0 10px;gap:8px}
.sec-t h2{font-family:var(--display);font-size:21px;font-weight:600}
.card,.box{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin-top:12px}
.box{display:flex;flex-direction:column;gap:10px}
.box>h3,.card>h3{font-size:15px;color:var(--muted);font-weight:600}
.box.k{border-inline-start:6px solid var(--brand)}
.box.g{border-inline-start:6px solid var(--gold)}
.kv{display:flex;justify-content:space-between;gap:8px;padding:7px 0;border-bottom:1px dashed var(--line);font-variant-numeric:tabular-nums}
.kv:last-child{border:0}
.pill{display:inline-block;border-radius:99px;padding:2px 11px;font-size:12.5px;font-weight:700;background:var(--surface2)}
.pill.ok{background:var(--okbg);color:var(--ok)}.pill.bad{background:var(--badbg);color:var(--bad)}.pill.warn{background:var(--warnbg);color:var(--warn)}.pill.info{background:var(--infobg);color:var(--info)}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(104px,1fr));gap:8px}
.tile{background:var(--surface2);border-radius:12px;padding:10px 12px;min-width:0}
.tile b{display:block;font-size:21px;font-variant-numeric:tabular-nums;line-height:1.25}
.tile span{font-size:12.5px;color:var(--muted)}
.tile .sub{display:block;color:var(--fg);font-weight:600;font-size:13px}
.tile.ok b{color:var(--ok)}.tile.bad b{color:var(--bad)}.tile.warn b{color:var(--warn)}
.empty{padding:26px 12px;text-align:center;color:var(--muted)}
.saved{font-size:12.5px;color:var(--ok);min-height:18px}

/* alerts */
#banner{display:flex;flex-direction:column;gap:8px;margin-top:12px}
.alert{display:flex;gap:10px;align-items:flex-start;border-radius:14px;padding:12px;border:1.5px solid var(--line);background:var(--surface)}
.alert.bad{background:var(--badbg);border-color:var(--bad)}.alert.warn{background:var(--warnbg);border-color:var(--warn)}.alert.info{background:var(--infobg);border-color:var(--info)}
.alert p{margin:0;flex:1;min-width:0;font-weight:500}
.alert time{display:block;font-size:12px;color:var(--muted);font-weight:400}

/* house grid */
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.hc{background:var(--surface);border:1.5px solid var(--line);border-radius:var(--r);padding:14px;text-align:start;position:relative;overflow:hidden;min-width:0}
.hc .n{font-family:var(--display);font-size:46px;line-height:1;color:var(--brand);font-weight:600}
.hc .nm{font-size:12.5px;color:var(--muted)}
.hc .tr{font-weight:700;font-size:19px;margin-top:8px;font-variant-numeric:tabular-nums}
.hc .tr small{font-weight:500;color:var(--muted);font-size:13px}
.hc .ln{font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.hc .pb{height:7px;background:var(--surface2);border-radius:4px;margin-top:9px;overflow:hidden}
.hc .pb i{display:block;height:100%;background:var(--brand);border-radius:4px}
.hc.empty .n{color:var(--line)}
.hc .tag{position:absolute;top:10px;inset-inline-end:10px;font-size:11.5px;font-weight:700;border-radius:99px;padding:1px 8px}
.hc .tag.bad{background:var(--badbg);color:var(--bad)}.hc .tag.ok{background:var(--okbg);color:var(--ok)}

/* nav */
nav.dock{position:fixed;bottom:0;left:0;right:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);
  padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px))}
nav.dock div{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;max-width:640px;margin:0 auto}
nav.dock button{border:0;background:transparent;min-height:54px;border-radius:14px;font-size:12px;font-weight:600;color:var(--muted);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;padding:2px;position:relative}
nav.dock button span{font-size:20px;line-height:1.1}
nav.dock button[aria-current="page"]{background:var(--brand-soft);color:var(--brand)}
nav.dock button em{position:absolute;top:2px;inset-inline-end:14px;background:var(--bad);color:#fff;border-radius:99px;font-style:normal;font-size:10.5px;min-width:17px;height:17px;line-height:17px;text-align:center;font-weight:700}

/* sheet */
.sheet{position:fixed;inset:0;z-index:40;background:var(--bg);overflow-y:auto;padding-bottom:calc(120px + env(safe-area-inset-bottom,0px))}
.shead{position:sticky;top:0;z-index:2;background:var(--hero);color:var(--hero-fg);padding:calc(10px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px));display:flex;align-items:center;gap:12px}
.shead .back{min-height:42px;padding:0 16px;border-radius:12px;border:0;background:rgba(255,255,255,.14);font-weight:700;color:inherit}
.shead h2{font-family:var(--display);font-size:21px;font-weight:600;flex:1}
.tabs2{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:12px;background:var(--surface2);border-radius:14px;padding:4px}
.tabs2 button{border:0;background:transparent;min-height:46px;border-radius:11px;font-weight:700;color:var(--muted)}
.tabs2 button[aria-pressed="true"]{background:var(--brand);color:var(--brand-fg)}
.live{position:fixed;bottom:0;left:0;right:0;z-index:45;background:var(--hero);color:var(--hero-fg);display:grid;grid-template-columns:repeat(4,1fr);gap:4px;text-align:center;
  padding:10px max(12px,env(safe-area-inset-right,0px)) calc(10px + env(safe-area-inset-bottom,0px)) max(12px,env(safe-area-inset-left,0px))}
.live b{display:block;font-family:var(--display);font-size:20px;color:var(--gold);font-weight:600;font-variant-numeric:tabular-nums}
.live span{font-size:11.5px;opacity:.8}
.hrs{display:flex;gap:8px;overflow-x:auto;padding:4px 2px 10px;scrollbar-width:thin}
.hrs button{flex:0 0 auto;min-width:70px;min-height:50px;border-radius:14px;border:1.5px solid var(--line);background:var(--surface);font-weight:700;position:relative}
.hrs button[aria-pressed="true"]{background:var(--brand);color:var(--brand-fg);border-color:var(--brand)}
.hrs button i{position:absolute;top:5px;inset-inline-end:7px;width:8px;height:8px;border-radius:50%;background:var(--gold)}
.curt{font-size:13px;font-weight:600;color:var(--info);min-height:19px}
.hrow2{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;align-items:end}
.hnav{margin-top:12px;display:grid;gap:8px}.hnav .hch button{position:relative}.hnav .hch i{position:absolute;top:3px;right:3px;width:6px;height:6px;border-radius:50%;background:var(--gold)}.hnav .btn[disabled]{opacity:.35}
.sw{display:flex;align-items:center;justify-content:center;gap:6px;min-height:44px;padding:0 6px;border:1px solid var(--line);border-radius:12px;background:var(--surface);font-size:12.5px;cursor:pointer}
.hrow2 label.f>span{font-size:11.5px}
.hrow2 input{padding:6px 4px;min-height:44px;font-size:15px}
.hh{display:flex;flex-direction:column;gap:8px;border:1px solid var(--line);border-radius:14px;padding:10px;background:var(--surface);margin-top:10px}
.hh header{display:flex;justify-content:space-between;align-items:center}

/* tasks */
.task{background:var(--surface);border:1.5px solid var(--line);border-radius:var(--r);padding:13px;margin-top:10px;display:flex;flex-direction:column;gap:10px}
.task.done{border-color:var(--ok);background:var(--okbg)}
.task .top{display:flex;align-items:center;gap:12px}
.chk{width:34px;height:34px;flex:none;border-radius:10px;border:2px solid var(--line);background:var(--surface);font-size:18px;color:transparent;font-weight:900}
.chk[aria-pressed="true"]{background:var(--ok);border-color:var(--ok);color:#fff}
.task .top b{flex:1;font-size:16px}
.hch{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:6px}
.hch button{min-height:42px;border-radius:10px;border:1.5px solid var(--line);background:var(--surface2);font-weight:700;font-variant-numeric:tabular-nums}
.hch button[aria-pressed="true"]{background:var(--ok);border-color:var(--ok);color:#fff}
.prog{height:9px;background:var(--surface2);border-radius:5px;overflow:hidden}.prog i{display:block;height:100%;background:var(--ok);border-radius:5px}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}
.tbox{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
th,td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:center;font-size:14px;white-space:nowrap}
th{background:var(--surface2);font-weight:600}
td.hot{background:var(--badbg);color:var(--bad);font-weight:700}
td small{display:block;color:var(--muted);font-size:11.5px}
details>summary{cursor:pointer;font-weight:600;min-height:36px;display:flex;align-items:center}
.eng{background:linear-gradient(160deg,var(--brand-soft),var(--surface));border-color:var(--brand)}
.eng .who{font-family:var(--display);font-size:26px;font-weight:600;color:var(--brand)}
.titem{display:flex;flex-direction:column;gap:6px;padding:12px;border:1.5px solid var(--line);border-radius:14px;background:var(--surface);margin-top:10px}
.titem.late{border-color:var(--bad);background:var(--badbg)}.titem.done{opacity:.6}
.qty{display:flex;flex-wrap:wrap;gap:6px}.qty span{background:var(--surface2);border-radius:8px;padding:2px 9px;font-size:13px;font-variant-numeric:tabular-nums}
.houseset{border:1px solid var(--line);border-radius:14px;padding:12px;background:var(--bg);display:flex;flex-direction:column;gap:10px;margin-top:8px}
.iss{border:1px solid var(--line);border-radius:14px;padding:12px;background:var(--surface);display:flex;flex-direction:column;gap:8px;margin-top:8px}
.iss.done{opacity:.65}
ul.hl{margin:0;padding-inline-start:20px;display:flex;flex-direction:column;gap:4px}
.foot{text-align:center;color:var(--muted);font-size:13px;margin:26px 0 6px}
.foot b{font-family:var(--display);color:var(--brand);font-size:15px;font-weight:600}
@media (prefers-reduced-motion:no-preference){.alert{animation:pop .25s ease-out}@keyframes pop{from{transform:translateY(-6px);opacity:.3}to{transform:none;opacity:1}}}
</style>
</head>
<body>
<div id="app"></div>
<div id="sheetHost"></div>
<nav class="dock"><div id="nav"></div></nav>

<script>
(function(){
'use strict';
const KEY='dakahlia_farm_v1', VER=11;
const HOURS=[18,19,20,21,22,23,0,1,2,3,4,5,6];
const pad=n=>(n<10?'0':'')+n;
const isoDate=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const parseD=s=>new Date(s+'T12:00:00');
const addDays=(s,n)=>{const d=parseD(s);d.setDate(d.getDate()+n);return isoDate(d)};
const diffDays=(a,b)=>Math.round((parseD(b)-parseD(a))/864e5);
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const num=v=>{const n=parseFloat(v);return isNaN(n)?0:n};
const has=v=>v!==undefined&&v!==null&&v!==''&&!(typeof v==='number'&&isNaN(v));
const fmtN=n=>Number(n).toLocaleString('en-US',{maximumFractionDigits:1});
const $=(s,r)=>(r||document).querySelector(s);
const $$=(s,r)=>Array.from((r||document).querySelectorAll(s));
const hLabel=h=>(h%12||12)+(h>=12?' م':' ص');
const WD=['الأحد','الاثنين','الثلاثاء','الأربعاء','الخميس','الجمعة','السبت'];
const fmtDate=s=>{const d=parseD(s);return WD[d.getDay()]+' '+d.getDate()+'/'+(d.getMonth()+1)+'/'+d.getFullYear()};
const today=()=>isoDate(new Date());

/* ---------- state ---------- */
const mkHouses=()=>{const a=[];for(let i=1;i<=8;i++)a.push({id:i,name:'عنبر '+i,hensC:'',roosC:'',hensF:'',roosF:'',fans:'',show:true,tgtC:'',tgtF:''});return a};
const DEFTASKS=()=>[
 {id:'t1',label:'تفقد الفرز والنافق',shift:'day',perHouse:true,times:[],on:true},
 {id:'t2',label:'وجود علف في سير العلف (ذكور)',shift:'day',perHouse:true,times:[],on:true},
 {id:'t3',label:'وجود علف في سير العلف (إناث)',shift:'day',perHouse:true,times:[],on:true},
 {id:'t4',label:'تفقد الستائر حسب عدد المراوح الشغالة',shift:'day',perHouse:true,times:[],on:true,curtain:true},
 {id:'t5',label:'تفقد السبل',shift:'day',perHouse:true,times:['09:00','15:00'],on:true},
 {id:'t6',label:'تفقد خطوط النبل',shift:'day',perHouse:true,times:['08:00','14:00'],on:true},
 {id:'t7',label:'تفقد الإضاءة داخل العنابر',shift:'day',perHouse:true,times:[],on:true},
 {id:'t8',label:'تفقد الستائر مع تغيّر عدد المراوح',shift:'eve',perHouse:true,times:[],on:true,curtain:true},
 {id:'t9',label:'تفقد خطوط النبل',shift:'eve',perHouse:true,times:['20:00'],on:true},
 {id:'t10',label:'نزول العلف مع مهندس التعليف',shift:'eve',perHouse:false,times:[],on:true}];
const DEF=()=>({settings:{houses:mkHouses(),hot:30,tray:30,sound:true,
  steps:[{t:26,p:25},{t:28,p:50},{t:30,p:75},{t:32,p:100}],
  curtain:[{f:4,cm:35},{f:6,cm:50},{f:8,cm:65},{f:10,cm:80}],curtainPer:8,hegM:'',hegF:'',hegSource:'all',
  tasks:DEFTASKS(),engineers:[],rot:{date:'',idx:0}},
  days:{},eve:{},treat:[],alerts:[],fired:{},todo:{},feedEng:{},issues:[],handover:{}});
let S,storageOK=true;
function load(){
  let raw=null;
  try{raw=JSON.parse(localStorage.getItem(KEY))}catch(e){storageOK=false}
  S=DEF();

function curtainFor(n){
  const tb=S.settings.curtain.filter(x=>has(x.f)&&has(x.cm)).map(x=>({f:num(x.f),cm:num(x.cm)})).sort((a,b)=>a.f-b.f),per=num(S.settings.curtainPer)||8;
  for(let i=0;i<tb.length;i++)if(tb[i].f===n)return {cm:tb[i].cm,approx:false};
  if(!tb.length||n<tb[0].f)return {cm:Math.round(n*per),approx:true};
  for(let i=0;i<tb.length-1;i++)if(n>tb[i].f&&n<tb[i+1].f){const a=tb[i],b=tb[i+1];return {cm:Math.round(a.cm+(b.cm-a.cm)*(n-a.f)/(b.f-a.f)),approx:true}}
  const l=tb[tb.length-1];return {cm:Math.round(l.cm+(n-l.f)*per),approx:true};
}

      const t=audioCtx.currentTime+dt;g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(0.3,t+0.02);g.gain.exponentialRampToValueAtTime(0.0001,t+0.2);o.start(t);o.stop(t+0.22)});

  if(!has(v))return;const t=num(v);if(t<num(S.settings.hot))return;
  const pick=pickStep(t),total=num(S.settings.houses[h-1].fans),need=pick&&total>0?Math.ceil(total*pick.p/100):0;
  pushAlert('dheat-'+ui.date+'-'+h,hname(h)+': الحرارة العظمى '+t+'° مرتفعة. '+(pick?'المطلوب تشغيل نحو '+pick.p+'% من المراوح'+(need?' ('+need+' من '+total+')':''):'راجع المراوح')+'.','bad');
}
function qtyText(t){const o=[];for(const id in t.q)if(has(t.q[id]))o.push(hname(+id)+': '+t.q[id]+' '+t.unit);return o.join('، ')||'لم تحدد'}
function tick(){
  const now=new Date(),td=isoDate(now),nowMin=now.getHours()*60+now.getMinutes();
  S.settings.tasks.forEach(t=>{
    if(t.on===false)return;
    (t.times||[]).forEach(tm=>{
      const m=/^(\d{1,2}):(\d{2})$/.exec(String(tm).trim());if(!m)return;
      const diff=nowMin-(num(m[1])*60+num(m[2]));
      if(diff>=0&&diff<=15&&!taskDone(t,td))pushAlert('task-'+t.id+'-'+td+'-'+tm,'مهمة: '+t.label+(diff>1?' (الموعد كان من '+diff+' دقيقة)':'')+' - '+tm,'info');
    });
  });
  S.treat.forEach(t=>{
    if(t.done)return;
    const due=new Date(t.date+'T'+t.time+':00').getTime();if(isNaN(due))return;
    const nowMs=now.getTime(),pre=due-num(t.remind)*60000,kind=t.kind==='vaccine'?'تحصين':'علاج';
    if(nowMs>=due){const late=Math.round((nowMs-due)/60000);pushAlert('tr-due-'+t.id,'حان موعد '+kind+': '+t.name+(late>1?' (متأخر '+late+' دقيقة)':'')+'. الكميات: '+qtyText(t),'bad')}
    else if(num(t.remind)>0&&nowMs>=pre)pushAlert('tr-pre-'+t.id,'قرّب موعد '+kind+': '+t.name+' الساعة '+t.time+'. جهّز الكميات: '+qtyText(t),'warn');
  });
  if(ui.tab==='treat')renderTList();
}

function applyAll(hour,vals,onlyEmpty,fromHouse){
  let n=0;

    eveFields.forEach(f=>{const v=vals[f[0]];if(!has(v))return;if(onlyEmpty&&has(r[f[0]]))return;r[f[0]]=v;n++});

  const treats=S.treat.filter(t=>{if(t.done)return false;const due=new Date(t.date+'T'+t.time+':00').getTime();return !isNaN(due)&&due<=now+864e5})
    .sort((a,b)=>(a.date+a.time)<(b.date+b.time)?-1:1)
    .map(t=>{const due=new Date(t.date+'T'+t.time+':00').getTime();return (t.kind==='vaccine'?'💉 ':'💊 ')+t.name+' — '+t.date+' '+t.time+(due<now?' (متأخر)':'')+' — '+qtyText(t)});
  const miss=[];(shift==='day'?dayHouses(date):[1,2,3,4,5,6,7,8]).forEach(h=>{if(shift==='day'?!houseHas(date,h):houseEve(h,date).n===0)miss.push(h)})
  const bad=S.alerts.filter(a=>a.level==='bad'&&now-a.ts<12*36e5).slice(0,5).map(a=>a.text);
  let sum;
  if(shift==='day'){const f=farmSum(date);sum=['الإجمالي: '+fmtN(f.tot)+' بيضة ('+fmtN(f.trays)+' طبق)'+(f.req>0?' = '+pctTxt(f):''),'النفوق: '+fmtN(f.mort)+' | الفرز: '+fmtN(f.cullM+f.cullF),'العلف: '+fmtN(f.feed)+' كجم']}
  else{const d=eveDay(date);let hotN=0;HOURS.forEach(x=>{for(let h=1;h<=8;h++){const r=eveRec(date,x,h);if(has(r.tin)&&num(r.tin)>=num(S.settings.hot))hotN++}});
    sum=['متوسط الحرارة: '+dash(d.avgT)+'° | الرطوبة: '+(d.hum===null?'—':Math.round(d.hum)+'%'),'قراءات حرارة مرتفعة: '+hotN,'مهندس التعليف: '+(engOn(date)||'—')]}
  return {tasks:tasks,treats:treats,miss:miss,bad:bad,sum:sum,issues:S.issues.filter(i=>!i.done).slice().reverse()};
}

    });

/* ---------- confirmations ---------- */
let pending=null;
function askConfirm(btn,action){
  if(pending&&pending.btn===btn){clearTimeout(pending.t);const a=pending.action;btn.textContent=pending.label;pending=null;runConfirmed(a);return}
  if(pending){pending.btn.textContent=pending.label;clearTimeout(pending.t)}
  const label=btn.textContent;btn.textContent='اضغط ثاني للتأكيد';
  pending={btn:btn,action:action,label:label,t:setTimeout(()=>{btn.textContent=label;pending=null},4000)};
}
function runConfirmed(a){
  const p=a.split(':');
  if(p[0]==='tdel'){S.treat=S.treat.filter(t=>t.id!==p[1]);persist();renderTList()}
  else if(p[0]==='clearalerts'){S.alerts=[];persist();renderBanner()}
  else if(p[0]==='deltask'){S.settings.tasks.splice(+p[1],1);persist();render()}
  else if(p[0]==='deleng'){S.settings.engineers.splice(+p[1],1);persist();render()}
  else if(p[0]==='delcur'){S.settings.curtain.pop();persist();render()}
  else if(p[0]==='isdel'){S.issues=S.issues.filter(i=>i.id!==p[1]);persist();showSheet()}
  else if(p[0]==='wipe'){S.days={};S.eve={};S.treat=[];S.alerts=[];S.fired={};S.todo={};S.feedEng={};S.issues=[];S.handover={};persist();render()}
  else if(p[0]==='restore'){
    const msg=$('#rsmsg');
    try{const o=JSON.parse(($('#rs').value||'').trim());if(!o||typeof o!=='object'||!o.settings)throw 0;localStorage.setItem(KEY,JSON.stringify(o));load();persist();msg.textContent='تمت الاستعادة ✓';msg.style.color='var(--ok)';renderBanner()}
    catch(e){msg.textContent='النص غير صالح، انسخ النسخة كاملة';msg.style.color='var(--bad)'}
  }
  else if(p[0]==='applyone'){
    const h=+p[1],hour=+p[2],r=eveRec(ui.date,hour,h),v={};eveFields.forEach(f=>{if(has(r[f[0]]))v[f[0]]=r[f[0]]});
    const n=applyAll(hour,v,false,h);ui.panel=false;showSheet();flashMsg('تم التطبيق على باقي العنابر ('+n+' خانة)');
  }
  else if(p[0]==='applyall'){
    const hour=+p[1],a=ui.all[hour]||{},v={};eveFields.forEach(f=>{if(has(a[f[0]]))v[f[0]]=a[f[0]]});
    const only=$('#onlyEmpty')&&$('#onlyEmpty').checked;
    const n=applyAll(hour,v,only,0);const keep=only;showSheet();const oe=$('#onlyEmpty');if(oe)oe.checked=keep;flashMsg('تم التطبيق على العنابر ('+n+' خانة)');
  }
}
(function(){let sx=0,sy=0,st=0;const host=document.getElementById('sheetHost');
  host.addEventListener('touchstart',e=>{const t=e.touches[0];sx=t.clientX;sy=t.clientY;st=Date.now()},{passive:true});
  host.addEventListener('touchend',e=>{if(!ui.open||ui.shift!=='day'||ui.hourView||ui.handover)return;const t=e.changedTouches[0],dx=t.clientX-sx,dy=t.clientY-sy;
    if(Math.abs(dx)>110&&Math.abs(dy)<45&&Date.now()-st<700){goPage(pageIdx()+(dx>0?1:-1))}},{passive:true});
})();
function flashMsg(t){const e=$('#savedmsg');if(e){e.textContent=t;e.style.color='';}}
function copyInto(txt,ta,msgEl){
  ta.hidden=false;ta.value=txt;
  const fb=()=>{ta.focus();ta.select();msgEl.textContent='اضغط مطولًا على النص واختر نسخ'};
  try{navigator.clipboard.writeText(txt).then(()=>{msgEl.textContent='اتنسخ ✓'}).catch(fb)}catch(e){fb()}
}

/* ---------- events ---------- */
document.addEventListener('click',e=>{
  const t=e.target.closest('button,summary,[data-opend]');if(!t)return;
  const d=t.dataset||{};
  if(t.id==='bell'){ui.panel=!ui.panel;renderPanel();return}
  if(d.ack){S.alerts.forEach(a=>{if(a.id===d.ack)a.read=true});persist();renderBanner();return}
  if(d.act==='readall'){S.alerts.forEach(a=>{a.read=true});persist();renderBanner();return}
  if(d.confirm){askConfirm(t,d.confirm);return}
  if(d.tab){ui.tab=d.tab;ui.panel=false;ui.open=null;ui.hourView=false;render();window.scrollTo(0,0);return}
  if(d.shift){ui.shift=d.shift;render();return}
  if(d.day){ui.date=addDays(ui.date,+d.day);render();return}
  if(d.open){ui.open=+d.open;openSheet();return}
  if(d.act==='back'){closeSheet();return}
  if(d.act==='hourview'){ui.hourView=true;openSheet();return}
  if(d.act==='handover'){ui.handover=true;openSheet();return}
  if(d.act==='addissue'){const tx=($('#isText').value||'').trim();if(!tx){$('#isText').focus();return}S.issues.push({id:uid(),house:+$('#isHouse').value,text:tx,date:ui.date,ts:Date.now(),done:false});persist();showSheet();return}
  if(d.isdone){S.issues.forEach(i=>{if(i.id===d.isdone){i.done=true;i.doneTs=Date.now()}});persist();showSheet();return}
  if(d.isreopen){S.issues.forEach(i=>{if(i.id===d.isreopen){i.done=false;delete i.doneTs}});persist();showSheet();return}
  if(d.act==='hocopy'){copyInto(handoverText(ui.date,ui.shift),$('#hoBox'),$('#hoMsg'));return}
  if(d.side){ui.side=d.side;showSheet();return}
  if(d.goh){const L=pagesList(),x=L.find(y=>y.h===+d.goh&&y.sd===(ui.side==='h'&&+d.goh!==8?'c':ui.side))||L.find(y=>y.h===+d.goh);if(x){ui.open=x.h;ui.side=x.sd;showSheet();const sh=$('.sheet');if(sh)sh.scrollTop=0}return}
  if(d.pg!==undefined){goPage(+d.pg);return}
  if(d.act==='tgtfix'){const r=rec(ui.date,sk()),v=has(r.target)?num(r.target):defTarget(ui.open,ui.side);if(!(v>0)){flashMsg('اكتب رقم المطلوب الأول');return}S.settings.houses[ui.open-1]['tgt'+ui.side.toUpperCase()]=String(v);persist();refreshDay();flashMsg('اتحفظ كمطلوب ثابت: '+fmtN(v)+' بيضة');return}
  if(d.hr){ui.hour=+d.hr;showSheet();return}
  if(d.opend){ui.date=d.opend;ui.tab='home';ui.shift='day';render();window.scrollTo(0,0);return}
  if(d.act==='report'){const box=$('#repBox'),m=$('#repMsg');copyInto(reportText(ui.date,ui.shift),box,m);return}
  if(d.act==='engreset'){delete S.feedEng[ui.date];persist();render();return}
  if(d.tchk){
    const tk=S.settings.tasks.find(x=>x.id===d.tchk),st=todoGet(ui.date,tk.id,true),done=taskDone(tk,ui.date);
    if(tk.perHouse){taskHouses(tk).forEach(i=>{st.h[i]=!done})}else st.all=!done;
    persist();const el=$('[data-task="'+tk.id+'"]');if(el)el.outerHTML=taskHTML(tk);renderNav();return}
  if(d.th){
    const p=d.th.split(':'),tk=S.settings.tasks.find(x=>x.id===p[0]),st=todoGet(ui.date,tk.id,true);
    st.h[+p[1]]=!st.h[+p[1]];persist();const el=$('[data-task="'+tk.id+'"]');if(el)el.outerHTML=taskHTML(tk);renderNav();return}
  if(d.act==='addtask'){S.settings.tasks.push({id:'t'+uid(),label:'مهمة جديدة',shift:ui.shift,perHouse:false,times:[],on:true});persist();render();return}
  if(d.act==='addeng'){const i=$('#engNew'),v=(i.value||'').trim();if(!v){i.focus();return}S.settings.engineers.push(v);if(!S.settings.rot.date){S.settings.rot={date:today(),idx:0}}persist();render();return}
  if(d.act==='addcur'){S.settings.curtain.push({f:'',cm:''});persist();render();return}
  if(d.kind){$$('#tkind button').forEach(b=>b.setAttribute('aria-pressed',b===t));return}
  if(d.tdone){S.treat.forEach(x=>{if(x.id===d.tdone)x.done=true});persist();renderTList();return}
  if(d.tundo){S.treat.forEach(x=>{if(x.id===d.tundo){x.done=false;delete S.fired['tr-due-'+x.id]}});persist();renderTList();return}
  if(t.id==='tApply'){const v=$('#tAll').value;$$('[data-q]').forEach(i=>{i.value=v});return}
  if(t.id==='tAdd'){
    const name=$('#tName').value.trim(),msg=$('#tMsg');
    if(!name){msg.textContent='اكتب الاسم الأول';msg.style.color='var(--bad)';return}
    const q={};$$('[data-q]').forEach(i=>{if(i.value!=='')q[i.getAttribute('data-q')]=i.value});
    if(!Object.keys(q).length){msg.textContent='حدد كمية لعنبر واحد على الأقل';msg.style.color='var(--bad)';return}
    S.treat.push({id:uid(),kind:$('#tkind [aria-pressed="true"]').getAttribute('data-kind'),name:name,date:$('#tDate').value,time:$('#tTime').value||'08:00',unit:$('#tUnit').value,remind:$('#tRemind').value,q:q,note:$('#tNote').value.trim(),done:false});
    persist();$('#tName').value='';$('#tNote').value='';$$('[data-q]').forEach(i=>{i.value=''});$('#tAll').value='';
    msg.textContent='تمت الإضافة ✓';msg.style.color='var(--ok)';renderTList();tick();return}
  if(d.copy){const m=$('#cpmsg');copyInto(d.copy==='json'?JSON.stringify(S):d.copy==='day'?dailyCSV():eveCSV(),$('#bk'),m);return}
  if(t.id==='wake'){
    const msg=$('#wakeMsg');
    if(window.__wl){try{window.__wl.release()}catch(x){}window.__wl=null;msg.textContent='اتلغت';return}
    try{if(!navigator.wakeLock){msg.textContent='المتصفح لا يدعم ده';return}navigator.wakeLock.request('screen').then(l=>{window.__wl=l;msg.textContent='الشاشة هتفضل شغالة والتطبيق ظاهر';l.addEventListener('release',()=>{window.__wl=null})}).catch(()=>{msg.textContent='مش متاح دلوقتي'})}catch(x){msg.textContent='مش متاح دلوقتي'}
    return}
  if(t.id==='notif'){const nm=$('#notifMsg');try{if(!('Notification' in window)){nm.textContent='المتصفح لا يدعم الإشعارات';return}Notification.requestPermission().then(p=>{nm.textContent=p==='granted'?'تم التفعيل ✓':'لم يتم السماح بالإشعارات'})}catch(x){nm.textContent='غير متاح'}return}
  if(t.id==='upd'){
    $('#updMsg').textContent='جاري التحديث...';
    const jobs=[],go=()=>location.replace(location.pathname+'?u='+Date.now());
    try{if(navigator.serviceWorker)jobs.push(navigator.serviceWorker.getRegistrations().then(rs=>Promise.all(rs.map(r=>r.unregister()))))}catch(x){}
    try{if(window.caches)jobs.push(caches.keys().then(ks=>Promise.all(ks.map(k=>caches.delete(k)))))}catch(x){}
    Promise.all(jobs).then(go,go);return}
});
document.addEventListener('input',e=>{
  const el=e.target;
  if(el.matches('[data-ho]')){const k=ui.date+':'+ui.shift;S.handover[k]=S.handover[k]||{};S.handover[k][el.dataset.ho]=el.value;persistSoon();return}
  if(el.matches('[data-k]')&&ui.open){
    const k=el.getAttribute('data-k'),r=rec(ui.date,SHARED[k]?String(ui.open):sk(),true);
    if(!SHARED[k]&&k!=='target'&&ui.side!=='h'&&!has(r.target)&&defTarget(ui.open,ui.side)>0)r.target=String(defTarget(ui.open,ui.side));
    if(el.value==='')delete r[k];else r[k]=el.value;
    persistSoon();refreshDay();
  }else if(el.matches('[data-ek]')){
    const h=+el.dataset.house,hour=+el.dataset.hour,r=eveRec(ui.date,hour,h,true),k=el.getAttribute('data-ek'),v=el.type==='checkbox'?(el.checked?'1':''):el.value;
    if(v==='')delete r[k];else r[k]=v;
    if(k==='htr'&&el.checked&&!has(r.heaters)){const hi=$('[data-ek="heaters"][data-house="'+h+'"][data-hour="'+hour+'"]');if(hi)hi.focus()}
    persistSoon();ui.hourView?refreshHourView():refreshEveSheet();
  }else if(el.matches('[data-ak]')){
    const hour=HOURS[ui.hour];ui.all[hour]=ui.all[hour]||{};const av=el.type==='checkbox'?(el.checked?'1':''):el.value;
    if(av==='')delete ui.all[hour][el.dataset.ak];else ui.all[hour][el.dataset.ak]=av;
    refreshHourView();
  }else if(el.matches('[data-path]')){
    const ty=el.dataset.type,path=el.dataset.path;
    let val=el.type==='checkbox'?el.checked:el.value;
    if(ty==='times')val=String(val).split(/[,،\s]+/).filter(Boolean);
    setPath(path,val);persistSoon();
  }
});
document.addEventListener('change',e=>{
  const el=e.target;
  if(el.id==='dDate'){if(el.value){ui.date=el.value;render()}return}
  if(el.id==='engSel'){S.feedEng[ui.date]=el.value;persist();render();return}
  if(el.id==='rotSel'){S.settings.rot={date:today(),idx:+el.value};persist();render();return}
  if(el.matches('[data-path]')&&(el.tagName==='SELECT'||el.type==='checkbox')){
    const path=el.dataset.path;setPath(path,el.type==='checkbox'?el.checked:el.value);persist();
    if(/^tasks\./.test(path)||path==='sound')render();return}
  if(el.matches('[data-ek="tin"],[data-ek="fans"],[data-ek="heaters"],[data-ek="htr"]')){checkEve(+el.dataset.house,+el.dataset.hour);return}
  if(el.matches('[data-k="tmax"]')&&ui.open)checkDayHeat(ui.open,el.value);
});
document.addEventListener('visibilitychange',()=>{if(!document.hidden)tick()});

render();flash();tick();
setInterval(tick,15000);
})();
</script>
<script>
if('serviceWorker' in navigator){
  var hadCtl=!!navigator.serviceWorker.controller,reloaded=false;
  navigator.serviceWorker.addEventListener('controllerchange',function(){if(hadCtl&&!reloaded){reloaded=true;location.reload()}});
  window.addEventListener('load',function(){navigator.serviceWorker.register('sw.js',{updateViaCache:'none'}).then(function(r){try{r.update()}catch(e){}}).catch(function(){})});
}
</script>
</body>
