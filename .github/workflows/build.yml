name: Build APK
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Unpack project
        run: unzip -q farm-android.zip -d app
      - name: Install and add Android
        working-directory: app
        run: npm install && npx cap add android && bash native/apply.sh && npx cap sync android
      - name: Signing key
        run: mkdir -p ~/.android && cp app/native/debug.keystore ~/.android/debug.keystore
      - name: Build APK
        working-directory: app/android
        run: chmod +x gradlew && ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: farm-apk
          path: app/android/app/build/outputs/apk/debug/app-debug.apk
